<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080a0d" />
  <title>Player Tells</title>
  <style>
    :root {
      --bg: #080a0d;
      --panel: #10151a;
      --panel-2: #151b21;
      --field: #0e1317;
      --button: #11161b;
      --track: #283139;
      --line: #263039;
      --text: #f3f6f8;
      --muted: #8d99a4;
      --accent: #c7ff3a;
      --accent-rgb: 199,255,58;
      --on-accent: #080a0d;
      --shadow: 0 18px 50px rgba(0,0,0,.38);
      --topbar-a: rgba(8,10,13,.97);
      --topbar-b: rgba(8,10,13,.84);
      --radius: 22px;
    }
    body[data-theme="light"] {
      --bg: #f4f5f3;
      --panel: #ffffff;
      --panel-2: #eef1ed;
      --field: #ffffff;
      --button: #ffffff;
      --track: #dce1dc;
      --line: #d7ddd7;
      --text: #121516;
      --muted: #697279;
      --shadow: 0 16px 42px rgba(20,28,22,.10);
      --topbar-a: rgba(244,245,243,.97);
      --topbar-b: rgba(244,245,243,.84);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body {
      background:
        radial-gradient(circle at 15% 15%, rgba(var(--accent-rgb),.07), transparent 27rem),
        radial-gradient(circle at 85% 90%, rgba(128,128,128,.05), transparent 30rem),
        var(--bg);
      overflow-x: hidden;
      transition: background .22s ease, color .22s ease;
    }
    button, input, textarea { font: inherit; }
    button { color: inherit; }
    button, .trait-card { -webkit-tap-highlight-color: transparent; }

    .noise {
      position: fixed; inset: 0; pointer-events: none; opacity: .16; z-index: 0;
      background-image: linear-gradient(rgba(128,128,128,.022) 1px, transparent 1px), linear-gradient(90deg, rgba(128,128,128,.018) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }

    #loading {
      position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
      background: #050607; transition: opacity .45s ease, visibility .45s ease;
    }
    #loading.hide { opacity: 0; visibility: hidden; }
    .loader-wrap { display: grid; gap: 30px; justify-items: center; }
    .logo-pulse-shell { width: 210px; height: 270px; position: relative; display: grid; place-items: center; isolation: isolate; }
    .logo-pulse-shell::before, .logo-pulse-shell::after {
      content: ""; position: absolute; inset: 16%; border: 1px solid rgba(255,255,255,.16);
      border-radius: 50%; z-index: -1; opacity: 0; animation: hypnotic-ring 1.85s cubic-bezier(.19,.8,.32,1) infinite;
    }
    .logo-pulse-shell::after { animation-delay: .72s; }
    .loader-logo {
      width: 171px; height: 220px; display: grid; place-items: center;
      color: #fff;
      filter: drop-shadow(0 0 4px rgba(255,255,255,.15));
      animation: hypnotic-logo 1.15s ease-in-out infinite alternate;
      will-change: transform, opacity, filter;
    }
    .loader-logo svg {
      width: 100%; height: 100%; display: block; overflow: visible;
    }
    .loader-line { width: 190px; height: 3px; border-radius: 999px; overflow: hidden; background: #20252a; }
    .loader-line::after {
      content: ""; display: block; width: 100%; height: 100%; border-radius: inherit;
      transform-origin: left center; transform: scaleX(0);
      background: linear-gradient(90deg, #747b81 0%, #ffffff 72%, #dce0e3 100%);
      animation: loader-progress 2.05s cubic-bezier(.23,.84,.27,1) forwards;
      box-shadow: 0 0 10px rgba(255,255,255,.34);
    }
    @keyframes hypnotic-logo {
      0% { transform: scale(.94); opacity: .55; filter: brightness(.72) blur(.15px) drop-shadow(0 0 2px rgba(255,255,255,.08)); }
      55% { opacity: .88; }
      100% { transform: scale(1.045); opacity: 1; filter: brightness(1.2) blur(0) drop-shadow(0 0 17px rgba(255,255,255,.28)); }
    }
    @keyframes hypnotic-ring {
      0% { transform: scale(.62); opacity: 0; }
      20% { opacity: .22; }
      100% { transform: scale(1.52); opacity: 0; }
    }
    @keyframes loader-progress {
      0% { transform: scaleX(0); opacity: .45; }
      22% { transform: scaleX(.17); }
      58% { transform: scaleX(.64); }
      88% { transform: scaleX(.92); }
      100% { transform: scaleX(1); opacity: 1; }
    }

    #app { position: relative; z-index: 1; min-height: 100vh; }
    .shell { width: min(1080px, calc(100% - 28px)); margin: 0 auto; padding: 22px 0 60px; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 62px;
      position: sticky; top: 0; z-index: 20; padding: 12px 0;
      background: linear-gradient(to bottom, var(--topbar-a), var(--topbar-b), transparent);
      backdrop-filter: blur(9px);
    }
    .brand { display: flex; gap: 11px; align-items: center; font-weight: 900; letter-spacing: -.03em; }
    .brand-mark {
      width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); display: grid; place-items: center;
      background: var(--button); position: relative; overflow: hidden;
    }
    .brand-mark::before, .brand-mark::after { content: ""; width: 7px; height: 2px; border-radius: 99px; background: var(--accent); position: absolute; top: 18px; }
    .brand-mark::before { left: 9px; transform: rotate(7deg); }
    .brand-mark::after { right: 9px; transform: rotate(-7deg); }
    .brand small { display: block; color: var(--muted); font-size: 10px; letter-spacing: .15em; text-transform: uppercase; font-weight: 750; margin-top: 1px; }

    .ghost, .primary, .icon-btn, .tool-btn, .choice-btn {
      border: 1px solid var(--line); background: var(--button); border-radius: 14px; cursor: pointer; transition: .16s ease;
    }
    .ghost { padding: 10px 14px; color: var(--text); }
    .primary { border-color: rgba(var(--accent-rgb),.42); background: var(--accent); color: var(--on-accent); font-weight: 900; padding: 11px 15px; }
    .icon-btn { width: 42px; height: 42px; display: grid; place-items: center; }
    .icon-btn svg, .tool-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .ghost:hover, .icon-btn:hover, .tool-btn:hover, .choice-btn:hover { border-color: rgba(var(--accent-rgb),.45); }
    .primary:hover { filter: brightness(1.03); }
    .back { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); border: 0; background: transparent; padding: 6px 0; cursor: pointer; }
    .back:hover { color: var(--text); }

    .hero { padding: 64px 0 38px; }
    .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .16em; font-weight: 850; color: var(--accent); }
    h1 { font-size: clamp(38px, 7vw, 72px); line-height: .95; margin: 12px 0 15px; letter-spacing: -.065em; max-width: 850px; }
    .hero p { max-width: 620px; color: var(--muted); line-height: 1.65; font-size: 16px; }

    .site-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
    .site-card {
      border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); padding: 18px; min-height: 126px;
      display: flex; align-items: center; gap: 16px; cursor: pointer; text-align: left; box-shadow: var(--shadow);
      position: relative; overflow: hidden;
    }
    .site-card::after { content: "›"; position: absolute; right: 18px; bottom: 13px; font-size: 24px; color: var(--muted); opacity: .55; }
    .site-card:hover { border-color: rgba(var(--accent-rgb),.34); transform: translateY(-2px); }
    .site-logo {
      flex: 0 0 auto; width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center;
      font-weight: 950; font-size: 20px; letter-spacing: -.06em; background: var(--bg); border: 1px solid var(--line); color: var(--accent);
    }
    .site-name { font-size: 19px; font-weight: 880; letter-spacing: -.03em; }
    .site-meta { color: var(--muted); font-size: 12px; margin-top: 5px; }

    .page-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; padding: 28px 0 18px; }
    .page-head h2 { margin: 7px 0 0; font-size: clamp(30px, 5vw, 46px); letter-spacing: -.045em; }
    .controls { display: flex; gap: 10px; align-items: center; margin: 10px 0 8px; }
    .search-wrap { flex: 1; position: relative; }
    .search-wrap::before { content: "⌕"; position: absolute; left: 15px; top: 50%; transform: translateY(-53%); color: var(--muted); font-size: 21px; }
    .search {
      width: 100%; border: 1px solid var(--line); background: var(--field); color: var(--text); border-radius: 15px;
      padding: 13px 15px 13px 43px; outline: 0;
    }
    .search:focus, .field input:focus, .field textarea:focus { border-color: rgba(var(--accent-rgb),.55); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),.08); }
    .directory-tools { display: flex; align-items: center; gap: 8px; margin: 0 0 20px; min-height: 35px; }
    .tool-btn {
      display: inline-flex; align-items: center; gap: 7px; padding: 7px 10px; border-radius: 10px;
      color: var(--muted); font-size: 12px; background: transparent;
    }
    .result-count { margin-left: auto; color: var(--muted); font-size: 11px; }

    .player-list { display: grid; gap: 9px; }
    .player-row {
      width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 17px; padding: 12px 14px;
      display: flex; align-items: center; gap: 13px; cursor: pointer; text-align: left; transition: .16s ease;
    }
    .player-row:hover { border-color: rgba(var(--accent-rgb),.34); transform: translateX(2px); }
    .avatar, .user-avatar {
      border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center; overflow: hidden;
      background: var(--panel-2); border: 1px solid var(--line); color: var(--text); font-weight: 900;
    }
    .avatar { width: 48px; height: 48px; font-size: 14px; letter-spacing: .03em; }
    .user-avatar { width: 36px; height: 36px; font-size: 10px; }
    .avatar img, .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .player-main { min-width: 0; flex: 1; }
    .player-name { font-weight: 850; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .player-sub { color: var(--muted); font-size: 12px; margin-top: 3px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .player-stats { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 7px; color: var(--muted); font-size: 10px; }
    .stat-dot::before { content: "•"; margin-right: 7px; opacity: .55; }
    .chev { color: var(--muted); font-size: 21px; opacity: .65; }
    .empty { border: 1px dashed var(--line); border-radius: 18px; padding: 42px 18px; text-align: center; color: var(--muted); }

    .profile-hero {
      margin-top: 20px; border: 1px solid var(--line); border-radius: 26px; padding: 24px;
      background: var(--panel); box-shadow: var(--shadow); display: grid; grid-template-columns: 110px 1fr auto; gap: 22px; align-items: center;
    }
    .profile-avatar { width: 110px; height: 110px; font-size: 25px; }
    .profile-title { font-size: clamp(28px, 5vw, 46px); font-weight: 950; letter-spacing: -.05em; overflow-wrap: anywhere; }
    .aliases, .profile-meta { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
    .chip { font-size: 11px; color: var(--muted); border: 1px solid var(--line); background: var(--field); padding: 6px 9px; border-radius: 999px; }
    .meta-chip { font-size: 10px; color: var(--muted); }

    .intel { margin-top: 20px; display: grid; gap: 10px; }
    .trait-card {
      width: 100%; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); padding: 17px 18px 13px;
      cursor: pointer; text-align: left; transition: .16s ease;
    }
    .trait-card:hover { border-color: rgba(var(--accent-rgb),.36); }
    .trait-labels { display: flex; justify-content: space-between; gap: 14px; color: var(--text); font-size: 13px; }
    .trait-labels strong { font-weight: 780; }
    .trait-scale {
      position: relative; height: 7px; border-radius: 99px; background: var(--track); margin-top: 13px;
    }
    .trait-ticks {
      position: absolute; inset: -4px 0; display: flex; align-items: center; justify-content: space-between;
      pointer-events: none;
    }
    .trait-ticks span {
      width: 2px; height: 11px; border-radius: 2px; background: var(--line);
    }
    .trait-ticks span:first-child, .trait-ticks span:last-child { height: 8px; }
    .trait-marker { z-index: 2; }
    .trait-marker {
      position: absolute; top: 50%; width: 17px; height: 17px; border-radius: 50%; background: var(--accent);
      border: 3px solid var(--panel); box-shadow: 0 0 0 1px rgba(var(--accent-rgb),.45), 0 0 13px rgba(var(--accent-rgb),.24);
      transform: translate(-50%,-50%);
    }
    .trait-hint { margin-top: 9px; text-align: right; color: var(--muted); font-size: 10px; }
    .survey-note { color: var(--muted); font-size: 11px; margin: 11px 2px 0; }

    .comments-section { margin-top: 34px; }
    .section-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .section-title h3 { margin: 0; font-size: 20px; letter-spacing: -.025em; }
    .comment-list { display: grid; gap: 9px; }
    .comment {
      border: 1px solid var(--line); background: var(--panel); border-radius: 17px; padding: 13px;
      display: grid; grid-template-columns: 36px 1fr; gap: 11px;
    }
    .comment-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .comment-name { font-size: 12px; font-weight: 850; }
    .comment-time { color: var(--muted); font-size: 10px; }
    .comment-body { margin-top: 5px; color: var(--text); font-size: 12px; line-height: 1.55; }
    .comment-form { display: flex; gap: 8px; margin-top: 10px; }
    .comment-form textarea {
      flex: 1; min-height: 48px; max-height: 130px; resize: vertical; border: 1px solid var(--line);
      background: var(--field); color: var(--text); border-radius: 14px; padding: 11px 12px; outline: 0;
    }

    .modal-backdrop {
      position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.66); backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center; padding: 18px;
    }
    .modal-backdrop.show { display: flex; }
    .modal {
      width: min(620px, 100%); max-height: min(86vh, 760px); overflow: auto; border: 1px solid var(--line);
      background: var(--panel); border-radius: 24px; padding: 21px; box-shadow: 0 32px 80px rgba(0,0,0,.45);
    }
    .modal-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 20px; }
    .modal h3 { margin: 0; font-size: 24px; letter-spacing: -.035em; }
    .modal-close { border: 0; background: transparent; color: var(--muted); font-size: 26px; cursor: pointer; }
    .field { display: grid; gap: 7px; margin-bottom: 14px; }
    .field label { color: var(--muted); font-size: 12px; font-weight: 750; }
    .field input, .field textarea {
      width: 100%; border: 1px solid var(--line); background: var(--field); color: var(--text);
      border-radius: 13px; padding: 12px 13px; outline: 0;
    }
    .form-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 18px; }
    .tiny { font-size: 11px; color: var(--muted); line-height: 1.55; }

    .setting-row { padding: 15px 0; border-top: 1px solid var(--line); }
    .setting-row:first-of-type { border-top: 0; padding-top: 0; }
    .setting-title { font-size: 12px; font-weight: 850; margin-bottom: 10px; }
    .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .choice-btn { padding: 11px 12px; font-size: 12px; }
    .choice-btn.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .colour-row { display: flex; align-items: center; gap: 12px; }
    .accent-preview {
      width: 42px; height: 42px; border-radius: 50%; flex: 0 0 auto;
      background: var(--accent); border: 3px solid var(--panel);
      box-shadow: 0 0 0 1px var(--line), 0 0 18px rgba(var(--accent-rgb),.25);
    }
    .text-btn { border: 0; background: transparent; color: var(--muted); padding: 4px 0; cursor: pointer; font-size: 11px; }
    .change-hue-btn { margin-top: 6px; padding: 9px 12px; border-radius: 11px; }

    .colour-picker-panel { display: grid; gap: 18px; }
    .colour-wheel-wrap {
      width: min(78vw, 340px); aspect-ratio: 1; margin: 0 auto; position: relative;
      display: grid; place-items: center;
    }
    .colour-wheel {
      width: 100%; height: 100%; border-radius: 50%; position: relative; cursor: crosshair;
      background:
        radial-gradient(circle at center, rgba(255,255,255,1) 0%, rgba(255,255,255,.92) 5%, rgba(255,255,255,.38) 38%, rgba(255,255,255,0) 72%),
        conic-gradient(from 90deg, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 16px 42px rgba(0,0,0,.22);
      touch-action: none;
    }
    .colour-wheel::after {
      content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background: rgba(0,0,0,var(--wheel-darkness,.0));
    }
    .wheel-cursor {
      position: absolute; width: 22px; height: 22px; border-radius: 50%;
      border: 3px solid white; box-shadow: 0 0 0 1px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.45);
      transform: translate(-50%,-50%); pointer-events: none; z-index: 2;
    }
    .brightness-wrap { display: grid; gap: 8px; }
    .brightness-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .brightness-slider {
      width: 100%; height: 10px; border-radius: 999px; appearance: none; -webkit-appearance: none;
      background: linear-gradient(90deg,#000,var(--picker-base,#fff)); outline: none;
    }
    .brightness-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
      background: white; border: 2px solid #222; box-shadow: 0 1px 5px rgba(0,0,0,.35);
    }
    .brightness-slider::-moz-range-thumb {
      width: 18px; height: 18px; border-radius: 50%; background: white; border: 2px solid #222;
    }
    .picker-preview-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .picker-current { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .picker-swatch { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); border: 1px solid var(--line); }
    .hex-readout { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .recent-colours { display: flex; gap: 9px; flex-wrap: wrap; }
    .recent-swatch {
      width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--panel);
      box-shadow: 0 0 0 1px var(--line); cursor: pointer;
    }
    .recent-swatch.active { box-shadow: 0 0 0 2px var(--accent); }
    .recent-empty { color: var(--muted); font-size: 11px; }

    .option-list { display: grid; gap: 7px; }
    .option-btn {
      width: 100%; display: flex; justify-content: space-between; gap: 12px; align-items: center;
      background: var(--field); border: 1px solid var(--line); border-radius: 13px; padding: 12px 13px; cursor: pointer; text-align: left;
    }
    .option-btn.active { border-color: var(--accent); }
    .option-tick { color: var(--accent); font-weight: 900; }

    .survey-block { margin: 20px 0 24px; }
    .survey-row { margin-bottom: 23px; }
    .survey-side-labels { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 7px; font-size: 12px; font-weight: 780; }
    .survey-value { color: var(--accent); font-weight: 900; font-variant-numeric: tabular-nums; text-align: center; font-size: 11px; margin-top: 4px; }
    .range-wrap { position: relative; padding-top: 3px; }
    input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
    .tick-row { display: grid; grid-template-columns: repeat(10, 1fr); padding: 1px 7px 0; }
    .tick-row span { width: 2px; height: 5px; background: var(--line); justify-self: center; }

    .vote-list { display: grid; gap: 9px; }
    .vote-row {
      display: grid; grid-template-columns: 36px 1fr auto; gap: 11px; align-items: center;
      border: 1px solid var(--line); background: var(--field); border-radius: 14px; padding: 10px;
    }
    .vote-name { font-size: 12px; font-weight: 850; }
    .vote-mini-track { position: relative; height: 4px; background: var(--track); border-radius: 999px; margin-top: 7px; }
    .vote-mini-dot { position: absolute; top: 50%; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); transform: translate(-50%,-50%); }
    .vote-number { font-size: 12px; font-weight: 900; color: var(--accent); font-variant-numeric: tabular-nums; }

    .toast {
      position: fixed; left: 50%; bottom: 24px; z-index: 100; transform: translate(-50%, 20px);
      opacity: 0; pointer-events: none; background: var(--panel); border: 1px solid rgba(var(--accent-rgb),.35);
      color: var(--text); padding: 10px 14px; border-radius: 999px; font-size: 12px; transition: .2s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 760px) {
      .site-grid { grid-template-columns: 1fr; }
      .hero { padding-top: 38px; }
      .profile-hero { grid-template-columns: 78px 1fr; gap: 15px; padding: 18px; }
      .profile-avatar { width: 78px; height: 78px; font-size: 18px; }
      .profile-hero .primary { grid-column: 1 / -1; width: 100%; }
      .page-head { align-items: start; }
      .controls { align-items: stretch; }
      .controls .primary { white-space: nowrap; }
      .comment-form { align-items: stretch; }
      .comment-form .primary { padding-inline: 13px; }
    }
  </style>
</head>
<body>
  <div class="noise"></div>

  <div id="loading">
    <div class="loader-wrap">
      <div class="logo-pulse-shell">
        <div class="loader-logo" aria-label="Player Tells">
          <svg viewBox="0 0 402 521" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">

  <main id="app"></main>

  <div id="modalBackdrop" class="modal-backdrop" aria-hidden="true">
    <div id="modal" class="modal"></div>
  </div>

  <div id="toast" class="toast">Saved</div>

  <script>
    const STORAGE_KEY = "playerTells_v1";
    const SETTINGS_KEY = "playerTells_settings_v1";

    const seedSites = [
      { id: "nightwire", name: "NightWire Poker", initials: "NW" },
      { id: "riverfox", name: "RiverFox", initials: "RF" },
      { id: "stackhouse", name: "StackHouse", initials: "SH" }
    ];

    const seedNames = {
      nightwire: ["Big_Toe77","3BetBandit","FoldMeMaybe","xXSharkBaitXx","n0Flop4U","MangoStack","river_rat_92","VILLAIN.exe","PocketLint","AceVentura_11"],
      riverfox: ["Cold4Bet","tinyhammer","DrChipLeader","snap_call99","MoonFish_404","BigBlindBill","degen_ninja","ToastOnTheRiver","QQplease","CheckRaiseCat"],
      stackhouse: ["StackGoblin","A5sEnjoyer","not_a_bot_88","JammyDodger","TankForValue","OneMoreOrbit","LuckyToe1234","SilentRaiser","BubbleBully","OopsAllBluffs"]
    };

    const traits = [
      { key: "ie", left: "Introverted", right: "Extroverted" },
      { key: "sn", left: "Observant", right: "Intuitive" },
      { key: "tf", left: "Thinking", right: "Feeling" },
      { key: "jp", left: "Judging", right: "Prospecting" }
    ];

    const demoVoters = [
      { id: "maya", name: "Maya", avatar: "" },
      { id: "owen", name: "Owen", avatar: "" },
      { id: "leo", name: "Leo", avatar: "" },
      { id: "sam", name: "Sam", avatar: "" }
    ];

    const currentUser = { id: "you", name: "You", avatar: "" };
    const tagSets = [["NLH","Cash"],["MTT","NLH"],["Heads-up","Cash"],["High volume","NLH"]];

    const commentSamples = [
      "Speeds up a lot in straightforward value spots. Takes longer when the river is genuinely awkward.",
      "Very chatty after winning a pot, much quieter after losing one. Worth watching for tilt changes.",
      "Seen a couple of surprisingly light river calls. Does not seem scared of looking people up.",
      "Timing feels more consistent preflop than postflop. I would pay more attention to the later streets."
    ];

    function clamp(n) { return Math.max(1, Math.min(10, n)); }
    function isSeedPlayer(p) { return /^(nightwire|riverfox|stackhouse)-\d+$/.test(p.id || ""); }

    function seedSurvey(index) {
      const base = [
        { ie: 4, sn: 7, tf: 8, jp: 5 },
        { ie: 7, sn: 6, tf: 4, jp: 8 },
        { ie: 2, sn: 8, tf: 7, jp: 3 }
      ][index % 3];
      const shifts = [0, 1, -1];
      return demoVoters.slice(0, 3).map(function(voter, i) {
        return {
          author: voter,
          ie: clamp(base.ie + shifts[i]),
          sn: clamp(base.sn + (i === 2 ? -1 : i)),
          tf: clamp(base.tf + (i === 1 ? -1 : i === 2 ? 1 : 0)),
          jp: clamp(base.jp + (i === 1 ? 1 : i === 2 ? -1 : 0))
        };
      });
    }

    function seedComments(index) {
      const count = index % 3 === 0 ? 2 : 1;
      return new Array(count).fill(null).map(function(_, i) {
        return {
          id: "demo-" + index + "-" + i,
          author: demoVoters[(index + i) % demoVoters.length],
          body: commentSamples[(index + i) % commentSamples.length],
          time: "Demo note"
        };
      });
    }

    function makeSeedPlayers() {
      const players = [];
      Object.keys(seedNames).forEach(function(siteId) {
        seedNames[siteId].forEach(function(name, index) {
          players.push({
            id: siteId + "-" + (index + 1),
            siteId: siteId,
            name: name,
            aliases: index % 3 === 0 ? [name.replace(/[_-]/g, ""), "alt_" + (index + 7)] : [],
            avatar: "",
            tags: tagSets[index % tagSets.length],
            surveys: seedSurvey(index),
            comments: seedComments(index)
          });
        });
      });
      return players;
    }

    function initialState() {
      return { sites: seedSites, players: makeSeedPlayers() };
    }

    function migrateState(state) {
      state.sites = state.sites || seedSites;
      state.players = state.players || [];
      state.players.forEach(function(p, index) {
        p.aliases = p.aliases || [];
        p.avatar = p.avatar || "";
        p.surveys = p.surveys || [];
        const legacySingle = isSeedPlayer(p) && p.surveys.length === 1 && !p.surveys[0].author && !p.demoVotesExpanded;
        p.surveys = p.surveys.map(function(s, i) {
          if (!s.author) s.author = demoVoters[(index + i) % demoVoters.length];
          return s;
        });
        if (legacySingle) {
          const base = p.surveys[0];
          p.surveys.push({
            author: demoVoters[(index + 1) % demoVoters.length],
            ie: clamp(Number(base.ie) + 1), sn: clamp(Number(base.sn) - 1),
            tf: clamp(Number(base.tf) + 1), jp: clamp(Number(base.jp) + 1)
          });
          p.surveys.push({
            author: demoVoters[(index + 2) % demoVoters.length],
            ie: clamp(Number(base.ie) - 1), sn: clamp(Number(base.sn) + 1),
            tf: clamp(Number(base.tf) - 1), jp: clamp(Number(base.jp) - 1)
          });
          p.demoVotesExpanded = true;
        }
        if (!Array.isArray(p.tags)) p.tags = isSeedPlayer(p) ? tagSets[index % tagSets.length] : [];
        if (!Array.isArray(p.comments)) p.comments = isSeedPlayer(p) ? seedComments(index) : [];
      });
      return state;
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved && saved.sites && saved.players) {
          const migrated = migrateState(saved);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
          return migrated;
        }
      } catch (e) {}
      const fresh = initialState();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh));
      return fresh;
    }

    function loadSettings() {
      try {
        const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY));
        if (saved) return {
          theme: saved.theme === "light" ? "light" : "dark",
          accent: /^#[0-9a-f]{6}$/i.test(saved.accent || "") ? saved.accent : "#c7ff3a",
          recentColors: Array.isArray(saved.recentColors) ? saved.recentColors.filter(function(c) { return /^#[0-9a-f]{6}$/i.test(c); }).slice(0, 8) : []
        };
      } catch (e) {}
      return { theme: "dark", accent: "#c7ff3a", recentColors: [] };
    }

    let db = loadState();
    let settings = loadSettings();
    let route = { screen: "sites", siteId: null, playerId: null };
    let directoryState = { sort: "az", filter: "all" };

    function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }
    function saveSettings() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }

    function hexToRgb(hex) {
      const value = hex.replace("#", "");
      return {
        r: parseInt(value.slice(0,2),16),
        g: parseInt(value.slice(2,4),16),
        b: parseInt(value.slice(4,6),16)
      };
    }

    function applySettings() {
      const rgb = hexToRgb(settings.accent);
      const brightness = (rgb.r * 299 + rgb.g * 587 + rgb.b * 114) / 1000;
      document.documentElement.style.setProperty("--accent", settings.accent);
      document.documentElement.style.setProperty("--accent-rgb", rgb.r + "," + rgb.g + "," + rgb.b);
      document.documentElement.style.setProperty("--on-accent", brightness > 150 ? "#080a0d" : "#ffffff");
      document.body.dataset.theme = settings.theme;
      const themeMeta = document.querySelector('meta[name="theme-color"]');
      if (themeMeta) themeMeta.setAttribute("content", settings.theme === "light" ? "#f4f5f3" : "#080a0d");
    }

    function normalizeSearch(value) {
      return String(value || "").toLowerCase().normalize("NFKD").replace(/[^a-z0-9]/g, "");
    }

    function initials(name) {
      const clean = String(name || "").replace(/[^a-zA-Z0-9]/g, "");
      return (clean.slice(0, 2) || "PT").toUpperCase();
    }

    function averageSurvey(player, key) {
      if (!player.surveys || !player.surveys.length) return 5.5;
      const vals = player.surveys.map(function(s) { return Number(s[key]); }).filter(function(v) { return Number.isFinite(v); });
      if (!vals.length) return 5.5;
      return vals.reduce(function(a, b) { return a + b; }, 0) / vals.length;
    }

    function esc(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, function(ch) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[ch];
      });
    }

    function siteById(id) { return db.sites.find(function(s) { return s.id === id; }); }
    function playerById(id) { return db.players.find(function(p) { return p.id === id; }); }

    function settingsIcon() {
      return '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21H9.6v-.1A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3V9.6h.1A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.1A1.7 1.7 0 0 0 15.4 4a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.12.37.34.7.64.94.3.24.67.37 1.06.37h.1v4h-.1A1.7 1.7 0 0 0 19.4 15Z"></path></svg>';
    }

    function sortIcon() {
      return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h11M8 12h8M8 18h5"></path><path d="m3 7 2-2 2 2M5 5v14"></path></svg>';
    }

    function filterIcon() {
      return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16l-6.2 7.1v5.2l-3.6 1.7v-6.9L4 5Z"></path></svg>';
    }

    function header() {
      return '<div class="topbar"><div class="brand"><div class="brand-mark"></div><div>Player Tells<small>Private player intel</small></div></div>' +
        '<button class="icon-btn" id="settingsBtn" aria-label="Settings">' + settingsIcon() + '</button></div>';
    }

    function bindHeader() {
      const btn = document.getElementById("settingsBtn");
      if (btn) btn.onclick = openSettings;
    }

    function avatarHtml(person, cls) {
      const p = person || { name: "Unknown", avatar: "" };
      return '<div class="' + (cls || "user-avatar") + '">' +
        (p.avatar ? '<img src="' + esc(p.avatar) + '" alt="">' : esc(initials(p.name))) +
      '</div>';
    }

    function render() {
      if (route.screen === "sites") renderSites();
      if (route.screen === "players") renderPlayers();
      if (route.screen === "profile") renderProfile();
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function renderSites() {
      const app = document.getElementById("app");
      app.innerHTML =
        '<div class="shell">' +
          header() +
          '<section class="hero">' +
            '<div class="eyebrow">Know the player behind the username</div>' +
            '<h1>Read patterns.<br>Remember people.</h1>' +
            '<p>A compact player notebook for your team. Pick a network, find a username and build a shared picture of how that player behaves.</p>' +
          '</section>' +
          '<section class="site-grid">' +
            db.sites.map(function(site) {
              const count = db.players.filter(function(p) { return p.siteId === site.id; }).length;
              return '<button class="site-card" data-site="' + esc(site.id) + '">' +
                '<div class="site-logo">' + esc(site.initials) + '</div>' +
                '<div><div class="site-name">' + esc(site.name) + '</div><div class="site-meta">' + count + ' players logged</div></div>' +
              '</button>';
            }).join("") +
          '</section>' +
        '</div>';

      bindHeader();
      document.querySelectorAll("[data-site]").forEach(function(btn) {
        btn.addEventListener("click", function() {
          route = { screen: "players", siteId: btn.dataset.site, playerId: null };
          directoryState = { sort: "az", filter: "all" };
          render();
        });
      });
    }

    function renderPlayers() {
      const site = siteById(route.siteId);
      if (!site) { route.screen = "sites"; return render(); }

      const app = document.getElementById("app");
      app.innerHTML =
        '<div class="shell">' +
          header() +
          '<button class="back" id="backSites">← Poker sites</button>' +
          '<div class="page-head"><div><div class="eyebrow">' + esc(site.name) + '</div><h2>Player directory</h2></div></div>' +
          '<div class="controls">' +
            '<div class="search-wrap"><input id="search" class="search" placeholder="Search username or alias…" autocomplete="off"></div>' +
            '<button class="primary" id="addPlayer">+ Player</button>' +
          '</div>' +
          '<div class="directory-tools">' +
            '<button class="tool-btn" id="sortBtn">' + sortIcon() + '<span id="sortLabel"></span></button>' +
            '<button class="tool-btn" id="filterBtn">' + filterIcon() + '<span id="filterLabel"></span></button>' +
            '<span class="result-count" id="resultCount"></span>' +
          '</div>' +
          '<div id="playerList" class="player-list"></div>' +
        '</div>';

      bindHeader();
      document.getElementById("backSites").onclick = goSites;
      document.getElementById("addPlayer").onclick = openAddPlayer;
      document.getElementById("sortBtn").onclick = openSort;
      document.getElementById("filterBtn").onclick = openFilter;
      document.getElementById("search").addEventListener("input", function(e) { drawPlayerList(e.target.value); });
      drawPlayerList("");
    }

    function goSites() {
      route = { screen: "sites", siteId: null, playerId: null };
      render();
    }

    function sortLabel() {
      return { az: "A–Z", za: "Z–A", data: "Most data", comments: "Most discussed" }[directoryState.sort] || "A–Z";
    }

    function filterLabel() {
      return { all: "All", aliases: "Has aliases", comments: "Has comments", surveys: "Has reads" }[directoryState.filter] || "All";
    }

    function drawPlayerList(query) {
      const wrap = document.getElementById("playerList");
      if (!wrap) return;

      const q = normalizeSearch(query);
      let players = db.players.filter(function(p) { return p.siteId === route.siteId; });

      players = players.filter(function(p) {
        if (!q) return true;
        const haystack = [p.name].concat(p.aliases || []).map(normalizeSearch);
        return haystack.some(function(part) { return part.includes(q); });
      });

      players = players.filter(function(p) {
        if (directoryState.filter === "aliases") return (p.aliases || []).length > 0;
        if (directoryState.filter === "comments") return (p.comments || []).length > 0;
        if (directoryState.filter === "surveys") return (p.surveys || []).length > 0;
        return true;
      });

      players.sort(function(a, b) {
        if (directoryState.sort === "za") return b.name.localeCompare(a.name, undefined, { sensitivity: "base" });
        if (directoryState.sort === "data") {
          const da = (a.surveys || []).length + (a.comments || []).length + (a.aliases || []).length;
          const dbb = (b.surveys || []).length + (b.comments || []).length + (b.aliases || []).length;
          return dbb - da || a.name.localeCompare(b.name);
        }
        if (directoryState.sort === "comments") return (b.comments || []).length - (a.comments || []).length || a.name.localeCompare(b.name);
        return a.name.localeCompare(b.name, undefined, { sensitivity: "base" });
      });

      document.getElementById("sortLabel").textContent = "Sort: " + sortLabel();
      document.getElementById("filterLabel").textContent = directoryState.filter === "all" ? "Filter" : "Filter: " + filterLabel();
      document.getElementById("resultCount").textContent = players.length + (players.length === 1 ? " player" : " players");

      if (!players.length) {
        wrap.innerHTML = '<div class="empty">No players match that search or filter.</div>';
        return;
      }

      wrap.innerHTML = players.map(function(p) {
        const aliasText = p.aliases && p.aliases.length ? p.aliases.join(" · ") : "No aliases added";
        const stats = [
          (p.surveys || []).length + " reads",
          (p.comments || []).length + " comments"
        ].concat(p.tags || []);
        return '<button class="player-row" data-player="' + esc(p.id) + '">' +
          avatarHtml({ name: p.name, avatar: p.avatar }, "avatar") +
          '<div class="player-main"><div class="player-name">' + esc(p.name) + '</div>' +
          '<div class="player-sub">' + esc(aliasText) + '</div>' +
          '<div class="player-stats">' + stats.map(function(x, i) { return '<span' + (i ? ' class="stat-dot"' : '') + '>' + esc(x) + '</span>'; }).join("") + '</div></div>' +
          '<div class="chev">›</div>' +
        '</button>';
      }).join("");

      document.querySelectorAll("[data-player]").forEach(function(btn) {
        btn.addEventListener("click", function() {
          route = { screen: "profile", siteId: route.siteId, playerId: btn.dataset.player };
          render();
        });
      });
    }

    function openSort() {
      const options = [
        ["az","A → Z"],
        ["za","Z → A"],
        ["data","Most data"],
        ["comments","Most discussed"]
      ];
      openModal(
        '<div class="modal-head"><h3>Sort players</h3><button class="modal-close" data-close>×</button></div>' +
        '<div class="option-list">' +
        options.map(function(o) {
          return '<button class="option-btn' + (directoryState.sort === o[0] ? ' active' : '') + '" data-sort-choice="' + o[0] + '"><span>' + o[1] + '</span><span class="option-tick">' + (directoryState.sort === o[0] ? '✓' : '') + '</span></button>';
        }).join("") + '</div>'
      );
      document.querySelectorAll("[data-sort-choice]").forEach(function(btn) {
        btn.onclick = function() {
          directoryState.sort = btn.dataset.sortChoice;
          closeModal();
          drawPlayerList(document.getElementById("search").value);
        };
      });
    }

    function openFilter() {
      const options = [
        ["all","All players"],
        ["aliases","Has aliases"],
        ["comments","Has comments"],
        ["surveys","Has survey data"]
      ];
      openModal(
        '<div class="modal-head"><h3>Filter players</h3><button class="modal-close" data-close>×</button></div>' +
        '<div class="option-list">' +
        options.map(function(o) {
          return '<button class="option-btn' + (directoryState.filter === o[0] ? ' active' : '') + '" data-filter-choice="' + o[0] + '"><span>' + o[1] + '</span><span class="option-tick">' + (directoryState.filter === o[0] ? '✓' : '') + '</span></button>';
        }).join("") + '</div>'
      );
      document.querySelectorAll("[data-filter-choice]").forEach(function(btn) {
        btn.onclick = function() {
          directoryState.filter = btn.dataset.filterChoice;
          closeModal();
          drawPlayerList(document.getElementById("search").value);
        };
      });
    }

    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r,g,b), min = Math.min(r,g,b);
      const d = max - min;
      let h = 0;
      if (d) {
        if (max === r) h = 60 * (((g - b) / d) % 6);
        else if (max === g) h = 60 * (((b - r) / d) + 2);
        else h = 60 * (((r - g) / d) + 4);
      }
      if (h < 0) h += 360;
      return { h: h, s: max === 0 ? 0 : d / max, v: max };
    }

    function hsvToHex(h, sVal, vVal) {
      const c = vVal * sVal;
      const x = c * (1 - Math.abs((h / 60) % 2 - 1));
      const m = vVal - c;
      let r = 0, g = 0, b = 0;
      if (h < 60) { r = c; g = x; }
      else if (h < 120) { r = x; g = c; }
      else if (h < 180) { g = c; b = x; }
      else if (h < 240) { g = x; b = c; }
      else if (h < 300) { r = x; b = c; }
      else { r = c; b = x; }
      const toHex = function(n) { return Math.round((n + m) * 255).toString(16).padStart(2, "0"); };
      return "#" + toHex(r) + toHex(g) + toHex(b);
    }

    function rememberColour(hex) {
      settings.recentColors = (settings.recentColors || []).filter(function(c) { return c.toLowerCase() !== hex.toLowerCase(); });
      settings.recentColors.unshift(hex);
      settings.recentColors = settings.recentColors.slice(0, 8);
      saveSettings();
    }

    function openSettings() {
      openModal(
        '<div class="modal-head"><h3>Settings</h3><button class="modal-close" data-close>×</button></div>' +
        '<div class="setting-row"><div class="setting-title">Appearance</div><div class="choice-grid">' +
          '<button class="choice-btn' + (settings.theme === "dark" ? ' active' : '') + '" data-theme-choice="dark">Dark</button>' +
          '<button class="choice-btn' + (settings.theme === "light" ? ' active' : '') + '" data-theme-choice="light">Light</button>' +
        '</div></div>' +
        '<div class="setting-row"><div class="setting-title">Accent colour</div><div class="colour-row">' +
          '<div class="accent-preview"></div>' +
          '<div><div class="tiny">Changes buttons, markers and highlights.</div>' +
          '<button class="ghost change-hue-btn" id="changeHue" type="button">Change hue</button></div>' +
        '</div></div>'
      );

      document.querySelectorAll("[data-theme-choice]").forEach(function(btn) {
        btn.onclick = function() {
          settings.theme = btn.dataset.themeChoice;
          saveSettings();
          applySettings();
          openSettings();
        };
      });

      document.getElementById("changeHue").onclick = openColourPicker;
    }

    function openColourPicker() {
      const rgb = hexToRgb(settings.accent);
      const hsv = rgbToHsv(rgb.r, rgb.g, rgb.b);
      let picker = { h: hsv.h, s: hsv.s, v: hsv.v };
      const recents = (settings.recentColors || []).slice(0, 8);

      openModal(
        '<div class="modal-head"><div><div class="eyebrow">Accent colour</div><h3>Choose a hue</h3></div><button class="modal-close" data-close>×</button></div>' +
        '<div class="colour-picker-panel">' +
          '<div class="colour-wheel-wrap"><div class="colour-wheel" id="colourWheel"><span class="wheel-cursor" id="wheelCursor"></span></div></div>' +
          '<div class="brightness-wrap">' +
            '<div class="brightness-head"><span class="setting-title" style="margin:0">Brightness</span><span class="hex-readout" id="hexReadout">' + esc(settings.accent.toUpperCase()) + '</span></div>' +
            '<input class="brightness-slider" id="brightnessSlider" type="range" min="15" max="100" value="' + Math.round(picker.v * 100) + '">' +
          '</div>' +
          '<div class="picker-preview-row"><div class="picker-current"><span class="picker-swatch" id="pickerSwatch"></span><span class="tiny">Live preview</span></div>' +
            '<button class="primary" id="doneColour" type="button">Done</button></div>' +
          '<div><div class="setting-title">Recent colours</div><div class="recent-colours">' +
            (recents.length ? recents.map(function(c) {
              return '<button class="recent-swatch' + (c.toLowerCase() === settings.accent.toLowerCase() ? ' active' : '') + '" data-recent-colour="' + esc(c) + '" style="background:' + esc(c) + '" aria-label="' + esc(c) + '"></button>';
            }).join("") : '<span class="recent-empty">Your recent colours will appear here.</span>') +
          '</div></div>' +
          '<button class="text-btn" id="resetAccent" type="button">Reset to default</button>' +
        '</div>'
      );

      const wheel = document.getElementById("colourWheel");
      const cursor = document.getElementById("wheelCursor");
      const slider = document.getElementById("brightnessSlider");
      const swatch = document.getElementById("pickerSwatch");
      const readout = document.getElementById("hexReadout");

      function updateCursor() {
        const size = wheel.clientWidth;
        const radius = size / 2;
        const distance = picker.s * radius * .92;
        const angle = picker.h * Math.PI / 180;
        cursor.style.left = (radius + Math.cos(angle) * distance) + "px";
        cursor.style.top = (radius + Math.sin(angle) * distance) + "px";
      }

      function updateColour() {
        const hex = hsvToHex(picker.h, picker.s, picker.v);
        settings.accent = hex;
        saveSettings();
        applySettings();
        swatch.style.background = hex;
        readout.textContent = hex.toUpperCase();
        const baseHex = hsvToHex(picker.h, picker.s, 1);
        slider.style.setProperty("--picker-base", baseHex);
        slider.style.background = "linear-gradient(90deg,#000," + baseHex + ")";
        wheel.style.setProperty("--wheel-darkness", String(Math.max(0, 1 - picker.v) * .72));
        requestAnimationFrame(updateCursor);
      }

      function chooseFromPointer(e) {
        const rect = wheel.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = e.clientX - cx;
        const dy = e.clientY - cy;
        const radius = rect.width / 2;
        const dist = Math.min(Math.sqrt(dx * dx + dy * dy), radius * .92);
        picker.s = Math.max(0, Math.min(1, dist / (radius * .92)));
        picker.h = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
        updateColour();
      }

      let dragging = false;
      wheel.addEventListener("pointerdown", function(e) {
        dragging = true;
        wheel.setPointerCapture(e.pointerId);
        chooseFromPointer(e);
      });
      wheel.addEventListener("pointermove", function(e) {
        if (dragging) chooseFromPointer(e);
      });
      wheel.addEventListener("pointerup", function(e) {
        dragging = false;
        try { wheel.releasePointerCapture(e.pointerId); } catch (_) {}
      });
      wheel.addEventListener("pointercancel", function() { dragging = false; });

      slider.addEventListener("input", function(e) {
        picker.v = Number(e.target.value) / 100;
        updateColour();
      });

      document.querySelectorAll("[data-recent-colour]").forEach(function(btn) {
        btn.onclick = function() {
          const c = btn.dataset.recentColour;
          const rgbRecent = hexToRgb(c);
          picker = rgbToHsv(rgbRecent.r, rgbRecent.g, rgbRecent.b);
          slider.value = Math.round(picker.v * 100);
          updateColour();
        };
      });

      document.getElementById("resetAccent").onclick = function() {
        const def = hexToRgb("#c7ff3a");
        picker = rgbToHsv(def.r, def.g, def.b);
        slider.value = Math.round(picker.v * 100);
        updateColour();
      };

      document.getElementById("doneColour").onclick = function() {
        rememberColour(settings.accent);
        closeModal();
        openSettings();
      };

      updateColour();
    }

    function openAddPlayer() {
      const site = siteById(route.siteId);
      openModal(
        '<div class="modal-head"><div><div class="eyebrow">' + esc(site.name) + '</div><h3>Add player</h3></div><button class="modal-close" data-close>×</button></div>' +
        '<form id="addPlayerForm">' +
          '<div class="field"><label>Username</label><input name="name" required placeholder="e.g. Big_Toe77"></div>' +
          '<div class="field"><label>Aliases <span class="tiny">(optional, comma separated)</span></label><input name="aliases" placeholder="Other usernames, nicknames…"></div>' +
          '<div class="field"><label>Profile image URL <span class="tiny">(optional for prototype)</span></label><input name="avatar" placeholder="https://…"></div>' +
          '<div class="form-actions"><button class="ghost" type="button" data-close>Cancel</button><button class="primary" type="submit">Add player</button></div>' +
        '</form>'
      );

      document.getElementById("addPlayerForm").addEventListener("submit", function(e) {
        e.preventDefault();
        const form = new FormData(e.target);
        const name = String(form.get("name") || "").trim();
        if (!name) return;

        db.players.push({
          id: route.siteId + "-" + Date.now(),
          siteId: route.siteId,
          name: name,
          aliases: String(form.get("aliases") || "").split(",").map(function(x) { return x.trim(); }).filter(Boolean),
          avatar: String(form.get("avatar") || "").trim(),
          tags: [],
          surveys: [],
          comments: []
        });

        saveState();
        closeModal();
        drawPlayerList(document.getElementById("search").value);
        toast("Player added");
      });
    }

    function renderProfile() {
      const player = playerById(route.playerId);
      const site = siteById(route.siteId);
      if (!player || !site) { route.screen = "players"; return render(); }

      const aliasHtml = (player.aliases && player.aliases.length)
        ? player.aliases.map(function(a) { return '<span class="chip">' + esc(a) + '</span>'; }).join("")
        : '<span class="chip">No aliases yet</span>';

      const profileMeta = [
        (player.surveys || []).length + " reads",
        (player.comments || []).length + " comments"
      ].concat(player.tags || []);

      const traitsHtml = traits.map(function(t) {
        const avg = averageSurvey(player, t.key);
        const pct = ((avg - 1) / 9) * 100;
        const voteCount = (player.surveys || []).filter(function(s) { return Number.isFinite(Number(s[t.key])); }).length;
        return '<button class="trait-card" data-trait="' + t.key + '">' +
          '<div class="trait-labels"><strong>' + esc(t.left) + '</strong><strong>' + esc(t.right) + '</strong></div>' +
          '<div class="trait-scale"><div class="trait-ticks">' + new Array(10).fill('<span></span>').join("") + '</div><span class="trait-marker" style="left:' + pct.toFixed(1) + '%"></span></div>' +
          '<div class="trait-hint">View ' + voteCount + (voteCount === 1 ? ' vote' : ' votes') + '</div>' +
        '</button>';
      }).join("");

      const commentsHtml = renderComments(player);

      document.getElementById("app").innerHTML =
        '<div class="shell">' +
          header() +
          '<button class="back" id="backPlayers">← ' + esc(site.name) + '</button>' +
          '<section class="profile-hero">' +
            avatarHtml({ name: player.name, avatar: player.avatar }, "avatar profile-avatar") +
            '<div><div class="eyebrow">' + esc(site.name) + '</div><div class="profile-title">' + esc(player.name) + '</div>' +
            '<div class="aliases">' + aliasHtml + '</div>' +
            '<div class="profile-meta">' + profileMeta.map(function(x) { return '<span class="meta-chip">' + esc(x) + '</span>'; }).join("") + '</div></div>' +
            '<button class="primary" id="addSurvey">+ Add survey</button>' +
          '</section>' +
          '<section class="intel">' + traitsHtml + '</section>' +
          '<div class="survey-note">The marker shows the average. Tap any trait to see every individual vote.</div>' +
          commentsHtml +
        '</div>';

      bindHeader();
      document.getElementById("backPlayers").onclick = function() {
        route = { screen: "players", siteId: route.siteId, playerId: null };
        render();
      };
      document.getElementById("addSurvey").onclick = function() { openSurvey(player); };
      document.querySelectorAll("[data-trait]").forEach(function(btn) {
        btn.onclick = function() { openVoteBreakdown(player, btn.dataset.trait); };
      });

      const form = document.getElementById("commentForm");
      if (form) {
        form.addEventListener("submit", function(e) {
          e.preventDefault();
          const text = String(new FormData(form).get("comment") || "").trim();
          if (!text) return;
          player.comments = player.comments || [];
          player.comments.push({
            id: "comment-" + Date.now(),
            author: currentUser,
            body: text,
            time: new Date().toLocaleDateString()
          });
          saveState();
          renderProfile();
          toast("Comment added");
        });
      }
    }

    function renderComments(player) {
      const comments = player.comments || [];
      return '<section class="comments-section">' +
        '<div class="section-title"><h3>Comments</h3><span class="tiny">' + comments.length + '</span></div>' +
        '<div class="comment-list">' +
          (comments.length ? comments.map(function(c) {
            return '<div class="comment">' +
              avatarHtml(c.author, "user-avatar") +
              '<div><div class="comment-head"><span class="comment-name">' + esc((c.author || {}).name || "Unknown") + '</span><span class="comment-time">' + esc(c.time || "") + '</span></div>' +
              '<div class="comment-body">' + esc(c.body) + '</div></div>' +
            '</div>';
          }).join("") : '<div class="empty">No comments yet.</div>') +
        '</div>' +
        '<form class="comment-form" id="commentForm">' +
          '<textarea name="comment" placeholder="Add a player note…" aria-label="Add a player note"></textarea>' +
          '<button class="primary" type="submit">Post</button>' +
        '</form>' +
      '</section>';
    }

    function openVoteBreakdown(player, key) {
      const trait = traits.find(function(t) { return t.key === key; });
      if (!trait) return;
      const votes = (player.surveys || []).filter(function(s) { return Number.isFinite(Number(s[key])); });

      const rows = votes.length ? votes.map(function(vote) {
        const value = Number(vote[key]);
        const pct = ((value - 1) / 9) * 100;
        const author = vote.author || { name: "Unknown", avatar: "" };
        return '<div class="vote-row">' +
          avatarHtml(author, "user-avatar") +
          '<div><div class="vote-name">' + esc(author.name || "Unknown") + '</div>' +
          '<div class="vote-mini-track"><span class="vote-mini-dot" style="left:' + pct.toFixed(1) + '%"></span></div></div>' +
          '<div class="vote-number">' + value + '/10</div>' +
        '</div>';
      }).join("") : '<div class="empty">Nobody has voted on this yet.</div>';

      openModal(
        '<div class="modal-head"><div><div class="eyebrow">' + esc(player.name) + '</div><h3>' + esc(trait.left) + ' ↔ ' + esc(trait.right) + '</h3></div><button class="modal-close" data-close>×</button></div>' +
        '<div class="tiny" style="display:flex;justify-content:space-between;margin-bottom:10px"><span>' + esc(trait.left) + '</span><span>' + esc(trait.right) + '</span></div>' +
        '<div class="vote-list">' + rows + '</div>'
      );
    }

    function openSurvey(player) {
      const rows = traits.map(function(t) {
        return '<div class="survey-row">' +
          '<div class="survey-side-labels"><span>' + esc(t.left) + '</span><span>' + esc(t.right) + '</span></div>' +
          '<div class="range-wrap"><input type="range" name="' + t.key + '" min="1" max="10" value="5" step="1">' +
          '<div class="tick-row">' + new Array(10).fill('<span></span>').join("") + '</div></div>' +
          '<div class="survey-value" id="value-' + t.key + '">5 / 10</div>' +
        '</div>';
      }).join("");

      openModal(
        '<div class="modal-head"><div><div class="eyebrow">' + esc(player.name) + '</div><h3>Add your read</h3></div><button class="modal-close" data-close>×</button></div>' +
        '<div class="tiny">Each slider snaps to one of ten positions. Your vote stays visible in the trait breakdown.</div>' +
        '<form id="surveyForm"><div class="survey-block">' + rows + '</div>' +
        '<div class="form-actions"><button class="ghost" type="button" data-close>Cancel</button><button class="primary" type="submit">Save survey</button></div></form>'
      );

      document.querySelectorAll('#surveyForm input[type="range"]').forEach(function(input) {
        input.addEventListener("input", function() {
          document.getElementById("value-" + input.name).textContent = input.value + " / 10";
        });
      });

      document.getElementById("surveyForm").addEventListener("submit", function(e) {
        e.preventDefault();
        const form = new FormData(e.target);
        const survey = { author: currentUser };
        traits.forEach(function(t) { survey[t.key] = Number(form.get(t.key)); });
        player.surveys = player.surveys || [];
        player.surveys.push(survey);
        saveState();
        closeModal();
        renderProfile();
        toast("Survey added");
      });
    }

    function openModal(html) {
      const backdrop = document.getElementById("modalBackdrop");
      document.getElementById("modal").innerHTML = html;
      backdrop.classList.add("show");
      backdrop.setAttribute("aria-hidden", "false");
      document.querySelectorAll("[data-close]").forEach(function(btn) { btn.onclick = closeModal; });
    }

    function closeModal() {
      const backdrop = document.getElementById("modalBackdrop");
      backdrop.classList.remove("show");
      backdrop.setAttribute("aria-hidden", "true");
    }

    function toast(message) {
      const el = document.getElementById("toast");
      el.textContent = message;
      el.classList.add("show");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(function() { el.classList.remove("show"); }, 1900);
    }

    document.getElementById("modalBackdrop").addEventListener("click", function(e) {
      if (e.target.id === "modalBackdrop") closeModal();
    });

    window.addEventListener("keydown", function(e) {
      if (e.key === "Escape") closeModal();
    });

    applySettings();
    render();
    setTimeout(function() { document.getElementById("loading").classList.add("hide"); }, 2200);
  </script>
</body>
</html>
