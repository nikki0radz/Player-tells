<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080a0d" />
  <title>Player Tells</title>
  <style>
    :root {
      --bg: #080a0d;
      --panel: #10151a;
      --panel-2: #151b21;
      --field: #0e1317;
      --button: #11161b;
      --track: #283139;
      --line: #263039;
      --text: #f3f6f8;
      --muted: #8d99a4;
      --accent: #c7ff3a;
      --accent-rgb: 199,255,58;
      --on-accent: #080a0d;
      --shadow: 0 18px 50px rgba(0,0,0,.38);
      --topbar-a: rgba(8,10,13,.97);
      --topbar-b: rgba(8,10,13,.84);
      --radius: 22px;
    }
    body[data-theme="light"] {
      --bg: #f4f5f3;
      --panel: #ffffff;
      --panel-2: #eef1ed;
      --field: #ffffff;
      --button: #ffffff;
      --track: #dce1dc;
      --line: #d7ddd7;
      --text: #121516;
      --muted: #697279;
      --shadow: 0 16px 42px rgba(20,28,22,.10);
      --topbar-a: rgba(244,245,243,.97);
      --topbar-b: rgba(244,245,243,.84);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body {
      background:
        radial-gradient(circle at 15% 15%, rgba(var(--accent-rgb),.07), transparent 27rem),
        radial-gradient(circle at 85% 90%, rgba(128,128,128,.05), transparent 30rem),
        var(--bg);
      overflow-x: hidden;
      transition: background .22s ease, color .22s ease;
    }
    button, input, textarea { font: inherit; }
    button { color: inherit; }
    button, .trait-card { -webkit-tap-highlight-color: transparent; }

    .noise {
      position: fixed; inset: 0; pointer-events: none; opacity: .16; z-index: 0;
      background-image: linear-gradient(rgba(128,128,128,.022) 1px, transparent 1px), linear-gradient(90deg, rgba(128,128,128,.018) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }

    #loading {
      position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
      background: #050607; transition: opacity .45s ease, visibility .45s ease;
    }
    #loading.hide { opacity: 0; visibility: hidden; }
    .loader-wrap { display: grid; gap: 30px; justify-items: center; }
    .logo-pulse-shell {
      width: min(100vw, 1100px); height: min(72vh, 760px); position: relative;
      display: grid; place-items: center; isolation: isolate; overflow: visible;
    }
    .logo-echo {
      --echo-scale: 1.6;
      --echo-opacity: .22;
      position: absolute; width: 171px; height: 220px; display: grid; place-items: center;
      color: rgba(255,255,255,.56); z-index: -1; pointer-events: none; opacity: 0;
      transform-origin: center center; will-change: transform, opacity, filter;
      animation: logo-echo-wave 1.55s cubic-bezier(.12,.72,.18,1) infinite;
    }
    .logo-echo.echo-1 { --echo-scale: 1.45; --echo-opacity: .24; --echo-mid: .19; --echo-fade: .11; --echo-tail: .04; animation-delay: 0s; }
    .logo-echo.echo-2 { --echo-scale: 1.78; --echo-opacity: .20; --echo-mid: .16; --echo-fade: .09; --echo-tail: .03; animation-delay: .13s; }
    .logo-echo.echo-3 { --echo-scale: 2.10; --echo-opacity: .16; --echo-mid: .13; --echo-fade: .07; --echo-tail: .025; animation-delay: .26s; }
    .logo-echo.echo-4 { --echo-scale: 2.45; --echo-opacity: .12; --echo-mid: .095; --echo-fade: .05; --echo-tail: .018; animation-delay: .39s; }
    .logo-echo.echo-5 { --echo-scale: 2.90; --echo-opacity: .09; --echo-mid: .07; --echo-fade: .035; --echo-tail: .012; animation-delay: .52s; }
    .logo-echo svg {
      width: 100%; height: 100%; display: block; overflow: visible;
      shape-rendering: geometricPrecision;
      filter: drop-shadow(0 0 5px rgba(255,255,255,.05));
    }
    .logo-echo svg g,
    .logo-echo svg path {
      fill: none !important;
      stroke: currentColor !important;
      stroke-width: 2.7 !important;
      stroke-linecap: round !important;
      stroke-linejoin: round !important;
      vector-effect: non-scaling-stroke;
    }
    @media (min-width: 600px) {
      .logo-echo.echo-1 { --echo-scale: 1.55; }
      .logo-echo.echo-2 { --echo-scale: 2.05; }
      .logo-echo.echo-3 { --echo-scale: 2.65; }
      .logo-echo.echo-4 { --echo-scale: 3.25; }
      .logo-echo.echo-5 { --echo-scale: 3.85; }
    }
    @media (min-width: 900px) {
      .logo-echo.echo-1 { --echo-scale: 1.65; }
      .logo-echo.echo-2 { --echo-scale: 2.30; }
      .logo-echo.echo-3 { --echo-scale: 3.10; }
      .logo-echo.echo-4 { --echo-scale: 3.90; }
      .logo-echo.echo-5 { --echo-scale: 4.70; }
    }
    .loader-logo {
      width: 171px; height: 220px; display: grid; place-items: center;
      color: #fff;
      filter: drop-shadow(0 0 4px rgba(255,255,255,.15));
      animation: hypnotic-logo 1.15s ease-in-out infinite alternate;
      will-change: transform, opacity, filter;
    }
    .loader-logo svg {
      width: 100%; height: 100%; display: block; overflow: visible;
      shape-rendering: geometricPrecision;
    }
    .loader-line { width: 190px; height: 3px; border-radius: 999px; overflow: hidden; background: #20252a; }
    .loader-line::after {
      content: ""; display: block; width: 100%; height: 100%; border-radius: inherit;
      transform-origin: left center; transform: scaleX(0);
      background: linear-gradient(90deg, #747b81 0%, #ffffff 72%, #dce0e3 100%);
      animation: loader-progress 2.05s cubic-bezier(.23,.84,.27,1) forwards;
      box-shadow: 0 0 10px rgba(255,255,255,.34);
    }
    @keyframes hypnotic-logo {
      0% { transform: scale(.94); opacity: .55; filter: brightness(.72) blur(.15px) drop-shadow(0 0 2px rgba(255,255,255,.08)); }
      55% { opacity: .88; }
      100% { transform: scale(1.045); opacity: 1; filter: brightness(1.2) blur(0) drop-shadow(0 0 17px rgba(255,255,255,.28)); }
    }
    @keyframes logo-echo-wave {
      0% {
        transform: scale(.98);
        opacity: var(--echo-opacity);
        filter: blur(0);
      }
      26% {
        opacity: var(--echo-mid);
      }
      58% {
        opacity: var(--echo-fade);
      }
      82% {
        opacity: var(--echo-tail);
      }
      100% {
        transform: scale(var(--echo-scale));
        opacity: 0;
        filter: blur(.45px);
      }
    }
    @keyframes loader-progress {
      0% { transform: scaleX(0); opacity: .45; }
      22% { transform: scaleX(.17); }
      58% { transform: scaleX(.64); }
      88% { transform: scaleX(.92); }
      100% { transform: scaleX(1); opacity: 1; }
    }

    #app { position: relative; z-index: 1; min-height: 100vh; }
    .shell { width: min(1080px, calc(100% - 28px)); margin: 0 auto; padding: 22px 0 60px; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 62px;
      position: sticky; top: 0; z-index: 20; padding: 12px 0;
      background: linear-gradient(to bottom, var(--topbar-a), var(--topbar-b), transparent);
      backdrop-filter: blur(9px);
    }
    .brand { display: flex; gap: 11px; align-items: center; font-weight: 900; letter-spacing: -.03em; }
    .brand-mark {
      width: 38px; height: 38px; border-radius: 12px; border: 1px solid #22282d; display: grid; place-items: center;
      background: #050607; overflow: hidden; color: #ffffff;
    }
    .brand-mark svg {
      width: 25px; height: 31px; display: block; shape-rendering: geometricPrecision;
    }
    .brand small { display: block; color: var(--muted); font-size: 10px; letter-spacing: .15em; text-transform: uppercase; font-weight: 750; margin-top: 1px; }

    .ghost, .primary, .icon-btn, .tool-btn, .choice-btn {
      border: 1px solid var(--line); background: var(--button); border-radius: 14px; cursor: pointer; transition: .16s ease;
    }
    .ghost { padding: 10px 14px; color: var(--text); }
    .primary { border-color: rgba(var(--accent-rgb),.42); background: var(--accent); color: var(--on-accent); font-weight: 900; padding: 11px 15px; }
    .icon-btn { width: 42px; height: 42px; display: grid; place-items: center; }
    .icon-btn svg, .tool-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .ghost:hover, .icon-btn:hover, .tool-btn:hover, .choice-btn:hover { border-color: rgba(var(--accent-rgb),.45); }
    .primary:hover { filter: brightness(1.03); }
    .back { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); border: 0; background: transparent; padding: 6px 0; cursor: pointer; }
    .back:hover { color: var(--text); }

    .hero { padding: 64px 0 38px; }
    .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .16em; font-weight: 850; color: var(--accent); }
    h1 { font-size: clamp(38px, 7vw, 72px); line-height: .95; margin: 12px 0 15px; letter-spacing: -.065em; max-width: 850px; }
    .hero p { max-width: 620px; color: var(--muted); line-height: 1.65; font-size: 16px; }

    .site-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
    .site-card {
      border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); padding: 18px; min-height: 126px;
      display: flex; align-items: center; gap: 16px; cursor: pointer; text-align: left; box-shadow: var(--shadow);
      position: relative; overflow: hidden;
    }
    .site-card::after { content: "›"; position: absolute; right: 18px; bottom: 13px; font-size: 24px; color: var(--muted); opacity: .55; }
    .site-card:hover { border-color: rgba(var(--accent-rgb),.34); transform: translateY(-2px); }
    .site-logo {
      flex: 0 0 auto; width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center;
      font-weight: 950; font-size: 20px; letter-spacing: -.06em; background: var(--bg); border: 1px solid var(--line); color: var(--accent); overflow: hidden;
    }
    .site-name { font-size: 19px; font-weight: 880; letter-spacing: -.03em; }
    .site-meta { color: var(--muted); font-size: 12px; margin-top: 5px; }

    .page-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; padding: 28px 0 18px; }
    .page-head h2 { margin: 7px 0 0; font-size: clamp(30px, 5vw, 46px); letter-spacing: -.045em; }
    .controls { display: flex; gap: 10px; align-items: center; margin: 10px 0 8px; }
    .search-wrap { flex: 1; position: relative; }
    .search-wrap::before { content: "⌕"; position: absolute; left: 15px; top: 50%; transform: translateY(-53%); color: var(--muted); font-size: 21px; }
    .search {
      width: 100%; border: 1px solid var(--line); background: var(--field); color: var(--text); border-radius: 15px;
      padding: 13px 15px 13px 43px; outline: 0;
    }
    .search:focus, .field input:focus, .field textarea:focus { border-color: rgba(var(--accent-rgb),.55); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),.08); }
    .directory-tools { display: flex; align-items: center; gap: 8px; margin: 0 0 20px; min-height: 35px; }
    .tool-btn {
      display: inline-flex; align-items: center; gap: 7px; padding: 7px 10px; border-radius: 10px;
      color: var(--muted); font-size: 12px; background: transparent;
    }
    .result-count { margin-left: auto; color: var(--muted); font-size: 11px; }

    .player-list { display: grid; gap: 9px; }
    .player-row {
      width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 17px; padding: 12px 14px;
      display: flex; align-items: center; gap: 13px; cursor: pointer; text-align: left; transition: .16s ease;
    }
    .player-row:hover { border-color: rgba(var(--accent-rgb),.34); transform: translateX(2px); }
    .avatar, .user-avatar {
      border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center; overflow: hidden;
      background: var(--panel-2); border: 1px solid var(--line); color: var(--text); font-weight: 900;
    }
    .avatar { width: 48px; height: 48px; font-size: 14px; letter-spacing: .03em; }
    .user-avatar { width: 36px; height: 36px; font-size: 10px; }
    .avatar img, .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .player-main { min-width: 0; flex: 1; }
    .player-name { font-weight: 850; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .player-sub { color: var(--muted); font-size: 12px; margin-top: 3px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .player-stats { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 7px; color: var(--muted); font-size: 10px; }
    .stat-dot::before { content: "•"; margin-right: 7px; opacity: .55; }
    .chev { color: var(--muted); font-size: 21px; opacity: .65; }
    .empty { border: 1px dashed var(--line); border-radius: 18px; padding: 42px 18px; text-align: center; color: var(--muted); }

    .edit-banner {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin: 18px 0 16px; padding: 12px 14px; border: 1px solid rgba(var(--accent-rgb),.25);
      border-radius: 15px; background: rgba(var(--accent-rgb),.06);
    }
    .edit-banner strong { font-size: 12px; }
    .edit-banner span { color: var(--muted); font-size: 11px; }
    .edit-badge {
      flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
      background: var(--field); border: 1px solid var(--line); color: var(--accent); font-size: 14px;
    }
    .edit-site-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
    .edit-site-card {
      border: 1px solid var(--line); background: var(--panel); border-radius: 18px; padding: 14px;
      display: flex; align-items: center; gap: 12px; cursor: pointer; text-align: left;
    }
    .edit-site-card:hover, .edit-player-row:hover { border-color: rgba(var(--accent-rgb),.42); }
    .edit-site-info { min-width: 0; flex: 1; }
    .edit-site-name { font-weight: 850; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .edit-site-nickname { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .edit-player-row {
      width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 16px; padding: 11px 13px;
      display: flex; align-items: center; gap: 12px; cursor: pointer; text-align: left;
    }
    .image-editor {
      display: flex; align-items: center; gap: 14px; margin: 4px 0 16px;
      padding: 12px; border: 1px solid var(--line); background: var(--field); border-radius: 15px;
    }
    .image-editor-preview {
      width: 72px; height: 72px; border-radius: 50%; overflow: hidden; flex: 0 0 auto;
      background: var(--panel-2); border: 1px solid var(--line); display: grid; place-items: center;
      font-weight: 900; color: var(--muted);
    }
    .image-editor-preview img { width: 100%; height: 100%; object-fit: cover; }

    .duplicate-check { margin-top: -5px; margin-bottom: 14px; }
    .duplicate-status {
      min-height: 16px; color: var(--muted); font-size: 10px; margin: 5px 2px 7px;
    }
    .duplicate-status.blocked { color: #ff8585; }
    .possible-matches { display: grid; gap: 6px; }
    .possible-match {
      width: 100%; display: grid; grid-template-columns: 34px 1fr auto; gap: 9px; align-items: center;
      border: 1px solid var(--line); background: var(--field); color: var(--text);
      border-radius: 12px; padding: 8px 10px; cursor: pointer; text-align: left;
    }
    .possible-match:hover { border-color: rgba(var(--accent-rgb),.42); }
    .possible-match .avatar { width: 34px; height: 34px; font-size: 9px; }
    .possible-match-name { font-size: 11px; font-weight: 850; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .possible-match-meta { color: var(--muted); font-size: 9px; margin-top: 2px; }
    .match-exact { color: #ff8585; font-size: 9px; font-weight: 800; }
    .match-similar { color: var(--muted); font-size: 9px; }

    .link-editor {
      margin: 2px 0 16px; padding: 12px; border: 1px solid var(--line);
      background: var(--field); border-radius: 14px;
    }
    .link-editor-head { margin-bottom: 9px; }
    .link-editor-head strong { display: block; font-size: 11px; }
    .link-editor-head small { display: block; color: var(--muted); font-size: 9px; margin-top: 3px; line-height: 1.45; }
    .link-search {
      width: 100%; border: 1px solid var(--line); background: var(--panel); color: var(--text);
      border-radius: 11px; padding: 9px 10px; outline: 0; font-size: 11px;
    }
    .link-search:focus { border-color: rgba(var(--accent-rgb),.5); }
    .linked-selection { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
    .linked-pill {
      display: inline-flex; align-items: center; gap: 6px; border: 1px solid rgba(var(--accent-rgb),.25);
      background: rgba(var(--accent-rgb),.06); border-radius: 999px; padding: 5px 7px 5px 9px;
      font-size: 9px; color: var(--text);
    }
    .linked-pill button {
      border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 0 2px;
      font-size: 13px; line-height: 1;
    }
    .link-results { display: grid; gap: 6px; margin-top: 8px; }
    .link-result {
      width: 100%; display: grid; grid-template-columns: 34px 1fr auto; gap: 9px; align-items: center;
      border: 1px solid var(--line); background: var(--panel); color: var(--text);
      border-radius: 11px; padding: 7px 9px; cursor: pointer; text-align: left;
    }
    .link-result:hover { border-color: rgba(var(--accent-rgb),.4); }
    .link-result .avatar { width: 34px; height: 34px; font-size: 9px; }
    .link-result-name { font-size: 11px; font-weight: 850; }
    .link-result-site { color: var(--muted); font-size: 9px; margin-top: 2px; }
    .link-result-action { color: var(--accent); font-size: 9px; font-weight: 800; }
    .linked-profile-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 9px; }
    .linked-profile-label { color: var(--muted); font-size: 9px; margin-right: 2px; text-transform: uppercase; letter-spacing: .08em; }
    .linked-profile-chip {
      border: 1px solid rgba(var(--accent-rgb),.23); background: rgba(var(--accent-rgb),.055);
      color: var(--text); cursor: pointer;
    }
    .linked-profile-chip:hover { border-color: rgba(var(--accent-rgb),.48); color: var(--accent); }
    .survey-existing-note {
      border: 1px solid rgba(var(--accent-rgb),.24); background: rgba(var(--accent-rgb),.06);
      border-radius: 14px; padding: 13px; color: var(--text); font-size: 12px; line-height: 1.5;
    }
    .image-actions { display: grid; gap: 7px; }
    .upload-label {
      display: inline-flex; align-items: center; justify-content: center; width: fit-content;
      border: 1px solid var(--line); background: var(--button); border-radius: 11px; padding: 8px 11px;
      cursor: pointer; font-size: 11px; font-weight: 800;
    }
    .upload-label input { display: none; }

    .cropper-overlay {
      position: fixed; inset: 0; z-index: 250; background: #050607; color: #fff;
      display: grid; grid-template-rows: auto 1fr auto; touch-action: none;
    }
    .cropper-topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: max(14px, env(safe-area-inset-top)) 16px 12px; background: rgba(5,6,7,.96);
    }
    .cropper-topbar strong { font-size: 14px; }
    .cropper-text-btn {
      border: 0; background: transparent; color: #dce2e6; padding: 9px 4px; cursor: pointer;
      font-size: 13px; font-weight: 750;
    }
    .cropper-use {
      border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent);
      padding: 9px 13px; font-weight: 900; cursor: pointer;
    }
    .cropper-stage {
      min-height: 0; position: relative; overflow: hidden; display: grid; place-items: center;
      background: #050607; user-select: none; -webkit-user-select: none;
    }
    .cropper-photo {
      position: absolute; left: 50%; top: 50%; max-width: none; max-height: none;
      transform-origin: center center; pointer-events: none; will-change: transform;
    }
    .crop-circle {
      width: min(78vw, 340px); height: min(78vw, 340px); border-radius: 50%;
      position: relative; z-index: 3; border: 2px solid rgba(255,255,255,.95);
      box-shadow: 0 0 0 9999px rgba(0,0,0,.62), 0 0 0 1px rgba(0,0,0,.25) inset;
      pointer-events: none;
    }
    .crop-circle::before, .crop-circle::after {
      content: ""; position: absolute; background: rgba(255,255,255,.28); pointer-events: none;
    }
    .crop-circle::before { width: 1px; height: 100%; left: 50%; top: 0; }
    .crop-circle::after { height: 1px; width: 100%; top: 50%; left: 0; }
    .cropper-controls {
      padding: 18px 20px calc(18px + env(safe-area-inset-bottom)); background: rgba(5,6,7,.97);
    }
    .cropper-zoom-row { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
    .cropper-zoom-row span { font-size: 16px; color: #c7ced3; }
    .cropper-zoom {
      width: 100%; accent-color: var(--accent);
    }
    .cropper-hint { text-align: center; color: #929ba2; font-size: 11px; margin-top: 10px; }
    .settings-nav { display: grid; gap: 8px; }
    .settings-nav-btn {
      width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px;
      border: 1px solid var(--line); background: var(--field); color: var(--text);
      border-radius: 13px; padding: 12px 13px; cursor: pointer; text-align: left;
    }
    .settings-nav-btn small { display: block; color: var(--muted); font-size: 10px; margin-top: 2px; font-weight: 500; }

    .topbar-actions { display: flex; align-items: center; gap: 8px; }
    .top-profile-btn {
      width: 42px; height: 42px; padding: 0; border-radius: 50%; overflow: hidden;
      display: grid; place-items: center; border: 1px solid var(--line); background: var(--panel-2);

      "Very chatty after winning a pot, much quieter after losing one. Worth watching for tilt changes.",
      "Seen a couple of surprisingly light river calls. Does not seem scared of looking people up.",
      "Timing feels more consistent preflop than postflop. I would pay more attention to the later streets."
    ];

    function clamp(n) { return Math.max(1, Math.min(10, n)); }
    function isSeedPlayer(p) { return /^(nightwire|riverfox|stackhouse)-\d+$/.test(p.id || ""); }

    function seedSurvey(index) {
      const base = [
        { ie: 4, sn: 7, tf: 8, jp: 5 },
        { ie: 7, sn: 6, tf: 4, jp: 8 },
        { ie: 2, sn: 8, tf: 7, jp: 3 }
      ][index % 3];
      const shifts = [0, 1, -1];
      return demoVoters.slice(0, 3).map(function(voter, i) {
        return {
          author: voter,
          ie: clamp(base.ie + shifts[i]),
          sn: clamp(base.sn + (i === 2 ? -1 : i)),
          tf: clamp(base.tf + (i === 1 ? -1 : i === 2 ? 1 : 0)),
          jp: clamp(base.jp + (i === 1 ? 1 : i === 2 ? -1 : 0))
        };
      });
    }

    function seedComments(index) {
      const count = index % 3 === 0 ? 2 : 1;
      return new Array(count).fill(null).map(function(_, i) {
        return {
          id: "demo-" + index + "-" + i,
          author: demoVoters[(index + i) % demoVoters.length],
          body: commentSamples[(index + i) % commentSamples.length],
          time: "Demo note"
        };
      });
    }

    function makeSeedPlayers() {
      const players = [];
      Object.keys(seedNames).forEach(function(siteId) {
        seedNames[siteId].forEach(function(name, index) {
          players.push({
            id: siteId + "-" + (index + 1),
            siteId: siteId,
            name: name,
            aliases: index % 3 === 0 ? [name.replace(/[_-]/g, ""), "alt_" + (index + 7)] : [],
            avatar: "",
            tags: tagSets[index % tagSets.length],
            surveys: seedSurvey(index),
            comments: seedComments(index)
          });
        });
      });
      return players;
    }

    function initialState() {
      return { sites: seedSites, players: makeSeedPlayers() };
    }

    function migrateState(state) {
      state.sites = state.sites || seedSites;
      state.sites.forEach(function(site) {
        site.avatar = site.avatar || "";
        site.nickname = site.nickname || "";
        site.initials = site.initials || initials(site.name);
      });
      state.players = state.players || [];
      state.players.forEach(function(p, index) {
        p.aliases = p.aliases || [];
        p.avatar = p.avatar || "";
        p.description = p.description || "";
        p.history = Array.isArray(p.history) ? p.history : [];
        p.linkedPlayerIds = Array.isArray(p.linkedPlayerIds) ? p.linkedPlayerIds.filter(Boolean) : [];
        p.surveys = p.surveys || [];
        const legacySingle = isSeedPlayer(p) && p.surveys.length === 1 && !p.surveys[0].author && !p.demoVotesExpanded;
        p.surveys = p.surveys.map(function(s, i) {
          if (!s.author) s.author = demoVoters[(index + i) % demoVoters.length];
          return s;
        });
        const myVotes = p.surveys.filter(function(s) { return s.author && s.author.id === "you"; });
        if (myVotes.length > 1) {
          const latestMine = myVotes[myVotes.length - 1];
          p.surveys = p.surveys.filter(function(s) { return !(s.author && s.author.id === "you"); });
          p.surveys.push(latestMine);
        }
        if (legacySingle) {
          const base = p.surveys[0];
          p.surveys.push({
            author: demoVoters[(index + 1) % demoVoters.length],
            ie: clamp(Number(base.ie) + 1), sn: clamp(Number(base.sn) - 1),
            tf: clamp(Number(base.tf) + 1), jp: clamp(Number(base.jp) + 1)
          });
          p.surveys.push({
            author: demoVoters[(index + 2) % demoVoters.length],
            ie: clamp(Number(base.ie) - 1), sn: clamp(Number(base.sn) + 1),
            tf: clamp(Number(base.tf) - 1), jp: clamp(Number(base.jp) - 1)
          });
          p.demoVotesExpanded = true;
        }
        if (!Array.isArray(p.tags)) p.tags = isSeedPlayer(p) ? tagSets[index % tagSets.length] : [];
        if (!Array.isArray(p.comments)) p.comments = isSeedPlayer(p) ? seedComments(index) : [];
      });
      return state;
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved && saved.sites && saved.players) {
          const migrated = migrateState(saved);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
          return migrated;
        }
      } catch (e) {}
      const fresh = initialState();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh));
      return fresh;
    }

    function loadSettings() {
      try {
        const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY));
        if (saved) return {
          theme: saved.theme === "light" ? "light" : "dark",
          accent: /^#[0-9a-f]{6}$/i.test(saved.accent || "") ? saved.accent : "#c7ff3a",
          recentColors: Array.isArray(saved.recentColors) ? saved.recentColors.filter(function(c) { return /^#[0-9a-f]{6}$/i.test(c); }).slice(0, 8) : []
        };
      } catch (e) {}
      return { theme: "dark", accent: "#c7ff3a", recentColors: [] };
    }

    let db = loadState();
    let settings = loadSettings();
    let route = { screen: "sites", siteId: null, playerId: null };
    let directoryState = { sort: "az", filter: "all" };

    function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }
    function saveSettings() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }
    function saveCurrentUser() { localStorage.setItem(USER_KEY, JSON.stringify(currentUser)); }

    function currentAuthorSnapshot() {
      return { id: currentUser.id, name: currentUser.name, avatar: currentUser.avatar };
    }

    function addPlayerHistory(player, action, detail) {
      player.history = Array.isArray(player.history) ? player.history : [];
      player.history.push({
        id: "history-" + Date.now() + "-" + Math.random().toString(36).slice(2,7),
        action: action,
        detail: detail || "",
        author: currentAuthorSnapshot(),
        timestamp: Date.now()
      });
    }

    function formatHistoryTime(timestamp) {
      if (!timestamp) return "Unknown time";
      try {
        return new Date(timestamp).toLocaleString([], {
          year: "numeric", month: "short", day: "numeric",
          hour: "2-digit", minute: "2-digit"
        });
      } catch (_) {
        return new Date(timestamp).toLocaleString();
      }
    }

    function hexToRgb(hex) {
      const value = hex.replace("#", "");
      return {
        r: parseInt(value.slice(0,2),16),
        g: parseInt(value.slice(2,4),16),
        b: parseInt(value.slice(4,6),16)
      };
    }

    function applySettings() {
      const rgb = hexToRgb(settings.accent);
      const brightness = (rgb.r * 299 + rgb.g * 587 + rgb.b * 114) / 1000;
      document.documentElement.style.setProperty("--accent", settings.accent);
      document.documentElement.style.setProperty("--accent-rgb", rgb.r + "," + rgb.g + "," + rgb.b);
      document.documentElement.style.setProperty("--on-accent", brightness > 150 ? "#080a0d" : "#ffffff");
      document.body.dataset.theme = settings.theme;
      const themeMeta = document.querySelector('meta[name="theme-color"]');
      if (themeMeta) themeMeta.setAttribute("content", settings.theme === "light" ? "#f4f5f3" : "#080a0d");
    }

    function normalizeSearch(value) {
      return String(value || "").toLowerCase().normalize("NFKD").replace(/[^a-z0-9]/g, "");
    }

    function initials(name) {
      const clean = String(name || "").replace(/[^a-zA-Z0-9]/g, "");
      return (clean.slice(0, 2) || "PT").toUpperCase();
    }

    function averageSurvey(player, key) {
      if (!player.surveys || !player.surveys.length) return 5.5;
      const vals = player.surveys.map(function(s) { return Number(s[key]); }).filter(function(v) { return Number.isFinite(v); });
      if (!vals.length) return 5.5;
      return vals.reduce(function(a, b) { return a + b; }, 0) / vals.length;
    }

    function esc(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, function(ch) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[ch];
      });
    }

    function siteById(id) { return db.sites.find(function(s) { return s.id === id; }); }
    function playerById(id) { return db.players.find(function(p) { return p.id === id; }); }

    function linkedPlayers(player) {
      return (player && Array.isArray(player.linkedPlayerIds) ? player.linkedPlayerIds : [])
        .map(playerById)
        .filter(Boolean);
    }

    function setPlayerLinks(player, nextIds) {
      const oldIds = Array.from(new Set((player.linkedPlayerIds || []).filter(Boolean)));
      const validIds = Array.from(new Set((nextIds || []).filter(function(id) {
        return id && id !== player.id && !!playerById(id);
      })));

      const removed = oldIds.filter(function(id) { return !validIds.includes(id); });
      const added = validIds.filter(function(id) { return !oldIds.includes(id); });

      removed.forEach(function(id) {
        const other = playerById(id);
        if (!other) return;
        other.linkedPlayerIds = (other.linkedPlayerIds || []).filter(function(x) { return x !== player.id; });
        const otherSite = siteById(other.siteId);
        const playerSite = siteById(player.siteId);
        addPlayerHistory(player, "Unlinked player profile", other.name + (otherSite ? " · " + otherSite.name : ""));
        addPlayerHistory(other, "Unlinked player profile", player.name + (playerSite ? " · " + playerSite.name : ""));
      });

      added.forEach(function(id) {
        const other = playerById(id);
        if (!other) return;
        other.linkedPlayerIds = Array.from(new Set((other.linkedPlayerIds || []).concat(player.id)));
        const otherSite = siteById(other.siteId);
        const playerSite = siteById(player.siteId);
        addPlayerHistory(player, "Linked player profile", other.name + (otherSite ? " · " + otherSite.name : ""));
        addPlayerHistory(other, "Linked player profile", player.name + (playerSite ? " · " + playerSite.name : ""));
      });

      player.linkedPlayerIds = validIds;
      return { added: added, removed: removed };
    }

    function playerLinkEditorMarkup() {
      return '<div class="link-editor">' +
        '<div class="link-editor-head"><strong>Link another player profile</strong><small>Use this when the same person has a different username on another poker site.</small></div>' +
        '<input class="link-search" id="playerLinkSearch" type="text" placeholder="Search another site…" autocomplete="off">' +
        '<div class="linked-selection" id="linkedPlayerSelection"></div>' +
        '<div class="link-results" id="playerLinkResults"></div>' +
      '</div>';
    }

    function bindPlayerLinkEditor(currentPlayerId, currentSiteId, initialIds, onChange) {
      let selected = Array.from(new Set((initialIds || []).filter(Boolean)));
      const search = document.getElementById("playerLinkSearch");
      const results = document.getElementById("playerLinkResults");
      const selection = document.getElementById("linkedPlayerSelection");
      if (!search || !results || !selection) return;

      function emit() { onChange(selected.slice()); }

      function drawSelection() {
        const chosen = selected.map(playerById).filter(Boolean);
        selection.innerHTML = chosen.length ? chosen.map(function(p) {
          const site = siteById(p.siteId);
          return '<span class="linked-pill">' + esc(p.name) +
            '<span style="color:var(--muted)">' + esc(site ? site.name : "") + '</span>' +
            '<button type="button" data-unlink-choice="' + esc(p.id) + '" aria-label="Remove link">×</button></span>';
        }).join("") : '<span class="tiny">No linked profiles selected.</span>';

        document.querySelectorAll("[data-unlink-choice]").forEach(function(btn) {
          btn.onclick = function() {
            selected = selected.filter(function(id) { return id !== btn.dataset.unlinkChoice; });
            drawSelection();
            drawResults();
            emit();
          };
        });
      }

      function drawResults() {
        const q = normalizeSearch(search.value);
        if (!q) {
          results.innerHTML = "";
          return;
        }

        const matches = db.players.filter(function(p) {
          if (p.id === currentPlayerId || p.siteId === currentSiteId || selected.includes(p.id)) return false;
          const haystack = [p.name].concat(p.aliases || []).map(normalizeSearch);
          return haystack.some(function(x) { return x.includes(q); });
        }).slice(0, 6);

        results.innerHTML = matches.length ? matches.map(function(p) {
          const site = siteById(p.siteId);
          return '<button type="button" class="link-result" data-link-choice="' + esc(p.id) + '">' +
            avatarHtml({ name: p.name, avatar: p.avatar }, "avatar") +
            '<div><div class="link-result-name">' + esc(p.name) + '</div><div class="link-result-site">' +
              esc(site ? site.name : "Unknown site") + '</div></div>' +
            '<span class="link-result-action">Link</span></button>';
        }).join("") : '<div class="tiny">No matching players on other sites.</div>';

        document.querySelectorAll("[data-link-choice]").forEach(function(btn) {
          btn.onclick = function() {
            if (!selected.includes(btn.dataset.linkChoice)) selected.push(btn.dataset.linkChoice);
            search.value = "";
            drawSelection();
            drawResults();
            emit();
          };
        });
      }

      search.addEventListener("input", drawResults);
      drawSelection();
      drawResults();
      emit();
    }

    function sortLabel() {
      return { az: "A–Z", za: "Z–A", data: "Most data", comments: "Most discussed" }[directoryState.sort] || "A–Z";
    }

    function filterLabel() {
      return { all: "All", aliases: "Has aliases", comments: "Has comments", surveys: "Has reads" }[directoryState.filter] || "All";
    }

    function drawPlayerList(query) {
      const wrap = document.getElementById("playerList");
      if (!wrap) return;

      const q = normalizeSearch(query);
      let players = db.players.filter(function(p) { return p.siteId === route.siteId; });

      players = players.filter(function(p) {
        if (!q) return true;
        const linkedNames = linkedPlayers(p).map(function(lp) { return lp.name; });
        const haystack = [p.name].concat(p.aliases || [], linkedNames).map(normalizeSearch);
        return haystack.some(function(part) { return part.includes(q); });
      });

      players = players.filter(function(p) {
        if (directoryState.filter === "aliases") return (p.aliases || []).length > 0 || linkedPlayers(p).length > 0;
        if (directoryState.filter === "comments") return (p.comments || []).length > 0;
        if (directoryState.filter === "surveys") return (p.surveys || []).length > 0;
        return true;
      });

      players.sort(function(a, b) {
        if (directoryState.sort === "za") return b.name.localeCompare(a.name, undefined, { sensitivity: "base" });
        if (directoryState.sort === "data") {
          const da = (a.surveys || []).length + (a.comments || []).length + (a.aliases || []).length;
          const dbb = (b.surveys || []).length + (b.comments || []).length + (b.aliases || []).length;
          return dbb - da || a.name.localeCompare(b.name);
        }
        if (directoryState.sort === "comments") return (b.comments || []).length - (a.comments || []).length || a.name.localeCompare(b.name);
        return a.name.localeCompare(b.name, undefined, { sensitivity: "base" });
      });

      document.getElementById("sortLabel").textContent = "Sort: " + sortLabel();
      document.getElementById("filterLabel").textContent = directoryState.filter === "all" ? "Filter" : "Filter: " + filterLabel();
      document.getElementById("resultCount").textContent = players.length + (players.length === 1 ? " player" : " players");

      if (!players.length) {
        wrap.innerHTML = '<div class="empty">No players match that search or filter.</div>';
        return;
      }

      wrap.innerHTML = players.map(function(p) {
        const linkedNames = linkedPlayers(p).map(function(lp) { return lp.name; });
        const aliasBits = (p.aliases || []).concat(linkedNames);
        const aliasText = aliasBits.length ? aliasBits.join(" · ") : "No aliases added";
        const stats = [
          (p.surveys || []).length + " reads",
          (p.comments || []).length + " comments"
        ].concat(p.tags || []);
        return '<button class="player-row" data-player="' + esc(p.id) + '">' +
          avatarHtml({ name: p.name, avatar: p.avatar }, "avatar") +
          '<div class="player-main"><div class="player-name">' + esc(p.name) + '</div>' +

    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r,g,b), min = Math.min(r,g,b);
      const d = max - min;
      let h = 0;
      if (d) {
        if (max === r) h = 60 * (((g - b) / d) % 6);
        else if (max === g) h = 60 * (((b - r) / d) + 2);
        else h = 60 * (((r - g) / d) + 4);
      }
      if (h < 0) h += 360;
      return { h: h, s: max === 0 ? 0 : d / max, v: max };
    }

    function hsvToHex(h, sVal, vVal) {
      const c = vVal * sVal;
      const x = c * (1 - Math.abs((h / 60) % 2 - 1));
      const m = vVal - c;
      let r = 0, g = 0, b = 0;
      if (h < 60) { r = c; g = x; }
      else if (h < 120) { r = x; g = c; }
      else if (h < 180) { g = c; b = x; }
      else if (h < 240) { g = x; b = c; }
      else if (h < 300) { r = x; b = c; }
      else { r = c; b = x; }
      const toHex = function(n) { return Math.round((n + m) * 255).toString(16).padStart(2, "0"); };
      return "#" + toHex(r) + toHex(g) + toHex(b);
    }

    function openColourPicker() {
      const rgb = hexToRgb(settings.accent);
      const hsv = rgbToHsv(rgb.r, rgb.g, rgb.b);
      let picker = { h: hsv.h, s: hsv.s, v: hsv.v };
      const recents = (settings.recentColors || []).slice(0, 8);

      openModal(
        '<div class="modal-head"><div><div class="eyebrow">Accent colour</div><h3>Choose a hue</h3></div><button class="modal-close" data-close>×</button></div>' +
        '<div class="colour-picker-panel">' +
          '<div class="colour-wheel-wrap"><div class="colour-wheel" id="colourWheel"><span class="wheel-cursor" id="wheelCursor"></span></div></div>' +
          '<div class="brightness-wrap">' +
            '<div class="brightness-head"><span class="setting-title" style="margin:0">Brightness</span><span class="hex-readout" id="hexReadout">' + esc(settings.accent.toUpperCase()) + '</span></div>' +
            '<input class="brightness-slider" id="brightnessSlider" type="range" min="15" max="100" value="' + Math.round(picker.v * 100) + '">' +
          '</div>' +
          '<div class="picker-preview-row"><div class="picker-current"><span class="picker-swatch" id="pickerSwatch"></span><span class="tiny">Live preview</span></div>' +
            '<button class="primary" id="doneColour" type="button">Done</button></div>' +
          '<div><div class="setting-title">Recent colours</div><div class="recent-colours">' +
            (recents.length ? recents.map(function(c) {
              return '<button class="recent-swatch' + (c.toLowerCase() === settings.accent.toLowerCase() ? ' active' : '') + '" data-recent-colour="' + esc(c) + '" style="background:' + esc(c) + '" aria-label="' + esc(c) + '"></button>';
            }).join("") : '<span class="recent-empty">Your recent colours will appear here.</span>') +
          '</div></div>' +
          '<button class="text-btn" id="resetAccent" type="button">Reset to default</button>' +
        '</div>'
      );

      const wheel = document.getElementById("colourWheel");
      const cursor = document.getElementById("wheelCursor");
      const slider = document.getElementById("brightnessSlider");
      const swatch = document.getElementById("pickerSwatch");
      const readout = document.getElementById("hexReadout");

      function updateCursor() {
        const size = wheel.clientWidth;
        const radius = size / 2;
        const distance = picker.s * radius * .92;
        const angle = picker.h * Math.PI / 180;
        cursor.style.left = (radius + Math.cos(angle) * distance) + "px";
        cursor.style.top = (radius + Math.sin(angle) * distance) + "px";
      }

      function updateColour() {
        const hex = hsvToHex(picker.h, picker.s, picker.v);
        settings.accent = hex;
        saveSettings();
        applySettings();
        swatch.style.background = hex;
        readout.textContent = hex.toUpperCase();
        const baseHex = hsvToHex(picker.h, picker.s, 1);
        slider.style.setProperty("--picker-base", baseHex);
        slider.style.background = "linear-gradient(90deg,#000," + baseHex + ")";
        wheel.style.setProperty("--wheel-darkness", String(Math.max(0, 1 - picker.v) * .72));
        requestAnimationFrame(updateCursor);
      }

      function chooseFromPointer(e) {
        const rect = wheel.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = e.clientX - cx;
        const dy = e.clientY - cy;
        const radius = rect.width / 2;
        const dist = Math.min(Math.sqrt(dx * dx + dy * dy), radius * .92);
        picker.s = Math.max(0, Math.min(1, dist / (radius * .92)));
        picker.h = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
        updateColour();
      }

      let dragging = false;
      wheel.addEventListener("pointerdown", function(e) {
        dragging = true;
        wheel.setPointerCapture(e.pointerId);
        chooseFromPointer(e);
      });
      wheel.addEventListener("pointermove", function(e) {
        if (dragging) chooseFromPointer(e);
      });
      wheel.addEventListener("pointerup", function(e) {
        dragging = false;
        try { wheel.releasePointerCapture(e.pointerId); } catch (_) {}
      });
      wheel.addEventListener("pointercancel", function() { dragging = false; });

      slider.addEventListener("input", function(e) {
        picker.v = Number(e.target.value) / 100;
        updateColour();
      });

      document.querySelectorAll("[data-recent-colour]").forEach(function(btn) {
        btn.onclick = function() {
          const c = btn.dataset.recentColour;
          const rgbRecent = hexToRgb(c);
          picker = rgbToHsv(rgbRecent.r, rgbRecent.g, rgbRecent.b);
          slider.value = Math.round(picker.v * 100);
          updateColour();
        };
      });

      document.getElementById("resetAccent").onclick = function() {
        const def = hexToRgb("#c7ff3a");
        picker = rgbToHsv(def.r, def.g, def.b);
        slider.value = Math.round(picker.v * 100);
        updateColour();
      };

      document.getElementById("doneColour").onclick = function() {
        rememberColour(settings.accent);
        closeModal();
        openSettings();
      };

      updateColour();
    }

          const circle = document.getElementById("cropCircle");
          const zoomInput = document.getElementById("cropZoom");
          photo.src = event.target.result;

          let baseScale = 1;
          let zoom = 1;
          let offsetX = 0;
          let offsetY = 0;
          let baseWidth = 0;
          let baseHeight = 0;
          let cropSize = 0;
          let dragging = false;
          let startX = 0, startY = 0, startOffsetX = 0, startOffsetY = 0;

          function clampOffsets() {
            const displayedW = baseWidth * zoom;
            const displayedH = baseHeight * zoom;
            const maxX = Math.max(0, (displayedW - cropSize) / 2);
            const maxY = Math.max(0, (displayedH - cropSize) / 2);
            offsetX = Math.max(-maxX, Math.min(maxX, offsetX));
            offsetY = Math.max(-maxY, Math.min(maxY, offsetY));
          }

          function renderCrop() {
            clampOffsets();
            photo.style.width = baseWidth + "px";
            photo.style.height = baseHeight + "px";
            photo.style.transform = "translate(-50%, -50%) translate(" + offsetX + "px," + offsetY + "px) scale(" + zoom + ")";
          }

          function setup() {
            cropSize = circle.getBoundingClientRect().width;
            baseScale = Math.max(cropSize / source.naturalWidth, cropSize / source.naturalHeight);
            baseWidth = source.naturalWidth * baseScale;
            baseHeight = source.naturalHeight * baseScale;
            renderCrop();
          }

          requestAnimationFrame(setup);

          zoomInput.addEventListener("input", function() {
            zoom = Number(zoomInput.value) / 100;
            renderCrop();
          });

          stage.addEventListener("pointerdown", function(e) {
            dragging = true;
            startX = e.clientX;
            startY = e.clientY;
            startOffsetX = offsetX;
            startOffsetY = offsetY;
            stage.setPointerCapture(e.pointerId);
          });
          stage.addEventListener("pointermove", function(e) {
            if (!dragging) return;
            offsetX = startOffsetX + (e.clientX - startX);
            offsetY = startOffsetY + (e.clientY - startY);
            renderCrop();
          });
          stage.addEventListener("pointerup", function(e) {
            dragging = false;
            try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
          });
          stage.addEventListener("pointercancel", function() { dragging = false; });

          document.getElementById("cropCancel").onclick = function() {
            overlay.remove();
          };

          document.getElementById("cropUse").onclick = function() {
            clampOffsets();
            const effectiveScale = baseScale * zoom;
            const displayedW = source.naturalWidth * effectiveScale;
            const displayedH = source.naturalHeight * effectiveScale;
            const cropLeftDisplayed = displayedW / 2 - offsetX - cropSize / 2;
            const cropTopDisplayed = displayedH / 2 - offsetY - cropSize / 2;
            const sourceX = cropLeftDisplayed / effectiveScale;
            const sourceY = cropTopDisplayed / effectiveScale;
            const sourceSize = cropSize / effectiveScale;

            const canvas = document.createElement("canvas");
            canvas.width = 420;
            canvas.height = 420;
            const ctx = canvas.getContext("2d");
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = "high";
            ctx.drawImage(source, sourceX, sourceY, sourceSize, sourceSize, 0, 0, 420, 420);

            const result = canvas.toDataURL("image/jpeg", .88);
            overlay.remove();
            callback(result);
          };

          window.addEventListener("resize", setup, { once: true });
        };
        source.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    function playerMatchesQuery(player, query) {
      const q = normalizeSearch(query);
      if (!q) return false;
      return [player.name].concat(player.aliases || []).some(function(value) {
        return normalizeSearch(value).includes(q);
      });
    }

    function isExactPlayerDuplicate(player, name, siteId) {
      if (player.siteId !== siteId) return false;
      const needle = normalizeSearch(name);
      if (!needle) return false;
      return [player.name].concat(player.aliases || []).some(function(value) {
        return normalizeSearch(value) === needle;
      });
    }

          '<div class="field"><label>Aliases <span class="tiny">(optional, comma separated)</span></label><input name="aliases" placeholder="Other usernames, nicknames…"></div>' +
          playerLinkEditorMarkup() +

          imageEditorMarkup("New player", "") +

        '</form>'
      );

      bindImageEditor("", function(v) { newPlayerAvatar = v; });
      bindPlayerLinkEditor(null, route.siteId, linkedIds, function(ids) { linkedIds = ids; });

      const nameInput = document.getElementById("addPlayerName");
      const matchesWrap = document.getElementById("possibleMatches");
      const status = document.getElementById("duplicateStatus");
      const submit = document.getElementById("addPlayerSubmit");

      function drawPossibleMatches() {
        const raw = nameInput.value.trim();
        const q = normalizeSearch(raw);
        matchesWrap.innerHTML = "";
        status.classList.remove("blocked");
        submit.disabled = false;
        submit.style.opacity = "1";

        if (q.length < 2) {
          status.textContent = "We’ll check the database as you type.";
          return;
        }

        const matches = db.players
          .filter(function(p) { return playerMatchesQuery(p, raw); })
          .sort(function(a, b) {
            const aExact = isExactPlayerDuplicate(a, raw, route.siteId) ? 0 : (a.siteId === route.siteId ? 1 : 2);
            const bExact = isExactPlayerDuplicate(b, raw, route.siteId) ? 0 : (b.siteId === route.siteId ? 1 : 2);
            return aExact - bExact || a.name.localeCompare(b.name);
          })
          .slice(0, 6);

        const exact = matches.find(function(p) { return isExactPlayerDuplicate(p, raw, route.siteId); });
        if (exact) {
          status.textContent = "This player already exists on " + site.name + ".";
          status.classList.add("blocked");
          submit.disabled = true;
          submit.style.opacity = ".45";
        } else if (matches.length) {
          status.textContent = "Possible matches already in the database:";
        } else {
          status.textContent = "No matching player found.";
        }

        matchesWrap.innerHTML = matches.map(function(p) {
          const matchSite = siteById(p.siteId);
          const exactHere = isExactPlayerDuplicate(p, raw, route.siteId);
          return '<button type="button" class="possible-match" data-existing-player="' + esc(p.id) + '">' +
            avatarHtml({ name: p.name, avatar: p.avatar }, "avatar") +
            '<div><div class="possible-match-name">' + esc(p.name) + '</div>' +
            '<div class="possible-match-meta">' + esc(matchSite ? matchSite.name : "Unknown site") +
              ((p.aliases || []).length ? ' · ' + esc((p.aliases || []).join(" · ")) : '') + '</div></div>' +
            '<span class="' + (exactHere ? 'match-exact' : 'match-similar') + '">' + (exactHere ? 'Already exists' : 'View') + '</span>' +
          '</button>';
        }).join("");

        document.querySelectorAll("[data-existing-player]").forEach(function(btn) {
          btn.onclick = function() {
            const existing = playerById(btn.dataset.existingPlayer);
            if (!existing) return;
            closeModal();
            route = { screen: "profile", siteId: existing.siteId, playerId: existing.id };
            render();
          };
        });
      }

      nameInput.addEventListener("input", drawPossibleMatches);

      document.getElementById("addPlayerForm").addEventListener("submit", function(e) {
        e.preventDefault();
        const form = new FormData(e.target);
        const name = String(form.get("name") || "").trim();
        if (!name) return;

        const exact = db.players.find(function(p) { return isExactPlayerDuplicate(p, name, route.siteId); });
        if (exact) {
          status.textContent = "This player already exists on " + site.name + ".";
          status.classList.add("blocked");
          submit.disabled = true;
          submit.style.opacity = ".45";
          return;
        }

        const newPlayer = {
          id: route.siteId + "-" + Date.now(),
          siteId: route.siteId,
          name: name,
          aliases: String(form.get("aliases") || "").split(",").map(function(x) { return x.trim(); }).filter(Boolean),
          avatar: newPlayerAvatar,
          description: String(form.get("description") || "").trim(),
          tags: [],
          surveys: [],
          comments: [],
          history: [],
          linkedPlayerIds: []
        };
        db.players.push(newPlayer);
        addPlayerHistory(newPlayer, "Added player", "Created this player profile");
        setPlayerLinks(newPlayer, linkedIds);

        saveState();
        closeModal();
        drawPlayerList(document.getElementById("search").value);
        toast("Player added");
      });
    }

      if (existing && !editingExisting) {
        openModal(
          '<div class="modal-head"><div><div class="eyebrow">' + esc(player.name) + '</div><h3>You’ve already voted</h3></div><button class="modal-close" data-close>×</button></div>' +
          '<div class="survey-existing-note">You’ve already submitted your survey for this player. You can edit your existing entry if your read has changed.</div>' +
          '<div class="form-actions"><button class="ghost" type="button" data-close>Keep current vote</button><button class="primary" id="editExistingSurvey" type="button">Edit my entry</button></div>'
        );
        document.getElementById("editExistingSurvey").onclick = function() {
          closeModal();
          openSurvey(player, true);
        };
        return;
      }

      const values = existing || { ie: 5, sn: 5, tf: 5, jp: 5 };
      const rows = traits.map(function(t) {
        const value = Number(values[t.key]) || 5;
        return '<div class="survey-row">' +
          '<div class="survey-side-labels"><span>' + esc(t.left) + '</span><span>' + esc(t.right) + '</span></div>' +
          '<div class="range-wrap"><input type="range" name="' + t.key + '" min="1" max="10" value="' + value + '" step="1">' +
          '<div class="tick-row">' + new Array(10).fill('<span></span>').join("") + '</div></div>' +
          '<div class="survey-value" id="value-' + t.key + '">' + value + ' / 10</div>' +
        '</div>';
      }).join("");

      openModal(
        '<div class="modal-head"><div><div class="eyebrow">' + esc(player.name) + '</div><h3>' + (existing ? 'Edit your read' : 'Add your read') + '</h3></div><button class="modal-close" data-close>×</button></div>' +
        '<div class="tiny">Each user has one survey per player. You can come back and update yours whenever your read changes.</div>' +
        '<form id="surveyForm"><div class="survey-block">' + rows + '</div>' +
        '<div class="form-actions"><button class="ghost" type="button" data-close>Cancel</button><button class="primary" type="submit">' + (existing ? 'Update survey' : 'Save survey') + '</button></div></form>'
      );

      document.querySelectorAll('#surveyForm input[type="range"]').forEach(function(input) {
        input.addEventListener("input", function() {
          document.getElementById("value-" + input.name).textContent = input.value + " / 10";
        });
      });

      document.getElementById("surveyForm").addEventListener("submit", function(e) {
        e.preventDefault();
        const form = new FormData(e.target);
        player.surveys = player.surveys || [];

        if (existing) {
          traits.forEach(function(t) { existing[t.key] = Number(form.get(t.key)); });
          existing.author = currentAuthorSnapshot();
          existing.updatedAt = Date.now();
          addPlayerHistory(player, "Updated survey", "Changed their player read");
        } else {
          const survey = {
            author: currentAuthorSnapshot(),
            createdAt: Date.now()
          };
          traits.forEach(function(t) { survey[t.key] = Number(form.get(t.key)); });
          player.surveys.push(survey);
          addPlayerHistory(player, "Submitted survey", "Added their player read");
        }

        saveState();
        closeModal();
        renderProfile();
        toast(existing ? "Survey updated" : "Survey added");
      });
    }

    function openModal(html) {
      const backdrop = document.getElementById("modalBackdrop");
      document.getElementById("modal").innerHTML = html;
      backdrop.classList.add("show");
      backdrop.setAttribute("aria-hidden", "false");
      document.querySelectorAll("[data-close]").forEach(function(btn) { btn.onclick = closeModal; });
    }

    function closeModal() {
      const backdrop = document.getElementById("modalBackdrop");
      backdrop.classList.remove("show");
      backdrop.setAttribute("aria-hidden", "true");
    }

    function toast(message) {
      const el = document.getElementById("toast");
      el.textContent = message;
      el.classList.add("show");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(function() { el.classList.remove("show"); }, 1900);
    }

    document.getElementById("modalBackdrop").addEventListener("click", function(e) {
      if (e.target.id === "modalBackdrop") closeModal();
    });

    window.addEventListener("keydown", function(e) {
      if (e.key === "Escape") closeModal();
    });

    applySettings();
    render();
    setTimeout(function() { document.getElementById("loading").classList.add("hide"); }, 2200);
  </script>
</body>
</html>
